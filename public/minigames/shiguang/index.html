<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光 · 老年回忆拼图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="拾光 老年回忆拼图小游戏">
    <header class="hud">
      <div class="brand"><span class="brand-mark">✦</span> 拾光 <small id="journey-label">一段慢慢拼回来的记忆</small></div>
      <div class="hud-tools"><span id="key-status">钥匙未取得</span><button id="map-button" data-sfx="select" title="地图 M">⌑ <span>地图</span></button><button id="help-button" data-sfx="select" title="操作说明 H">? <span>操作</span></button><button id="pause-button" data-sfx="select" title="暂停 Esc">Ⅱ</button></div>
    </header>
    <section class="play-area">
      <div class="world-wrap">
        <canvas id="world" width="1024" height="608" tabindex="0" aria-label="记忆世界。使用 A D 或方向键移动，空格跳跃，E 操作信号灯、钥匙与门。"></canvas>
        <div class="world-label"><span id="zone-name">01 / 旧书房与阁楼</span><span class="pixel-tag">MEMORY</span></div>
        <div id="interaction" class="interaction" hidden></div>
        <div class="region-caption" id="region-caption"></div>
        <div id="story" class="story" hidden><p id="story-text"></p><button id="story-close" data-sfx="select">继续走走 <span>空格</span></button></div>
      </div>
      <aside class="inventory" aria-label="已拾取的记忆碎片">
        <div class="inventory-title"><span>记忆碎片</span><small id="inventory-count">0 枚</small></div>
        <p class="inventory-subtitle">按住碎片，拖回它的位置</p>
        <div id="piece-list" class="piece-list"></div>
        <div id="empty-inventory" class="empty-inventory"><span class="empty-shape">✧</span><p>记忆散落在路上<br>碰到亮光即可拾起</p></div>
        <div class="inventory-footer"><div class="progress-heading"><span>回忆的路</span><span id="progress-count">0 / 11</span></div><div class="progress-bar"><i id="progress-fill"></i></div><div class="region-dots" id="region-dots"></div><p id="current-goal">先找到附近的记忆碎片</p></div>
      </aside>
    </section>
    <nav id="touch-controls" aria-label="触屏操作">
      <div class="touch-move"><button type="button" data-touch="left" aria-label="向左移动">←</button><button type="button" data-touch="right" aria-label="向右移动">→</button></div>
      <div class="touch-action"><button type="button" data-touch="jump">跳跃</button><button type="button" data-touch="interact">互动</button></div>
    </nav>
    <footer class="hint-bar"><span class="hint-orb"></span><span id="hint-text">A / D 移动 · Space 跳跃 · 碰到碎片即拾取 · M 地图</span><span id="save-status">本地记忆</span></footer>
    <canvas id="drag-layer" width="1280" height="720" aria-hidden="true"></canvas>
    <section id="cover" class="cover">
      <div class="cover-shade"></div>
      <div class="cover-content"><p class="eyebrow">THE LAST CHAPTER · 老年的回忆</p><h1>拾光</h1><p class="cover-line">有些路，想起了才能继续。<br>有些回忆，走过了才慢慢完整。</p><div class="cover-actions"><button class="primary" id="start-button" data-sfx="confirm">开始回忆 <span>→</span></button><button id="continue-button" data-sfx="confirm" class="secondary" hidden>继续上次的回忆</button></div><p class="cover-controls">左右移动 + 跳跃 / 鼠标拼接场景</p></div>
      <div class="cover-bottom"><span>MEMORY PUZZLE</span><span>可玩原型 v0.2 · 地图与剧情为示例</span></div>
    </section>
    <div id="modal" class="modal" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><p class="eyebrow" id="modal-eyebrow">MEMORY</p><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></section></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script>if(new URLSearchParams(location.search).has("embedded"))document.body.classList.add("embedded");</script>
  <script src="config.js"></script>
  <script src="level-data.js"></script>
  <script src="game.js"></script>
</body>
</html>
