<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字勇者 · 一周目</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
  font-family:"Courier New",ui-monospace,monospace;color:#7fe39a;cursor:none}
#app{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.card{position:absolute;background:rgba(6,10,14,.78);
  border:1px solid rgba(127,227,154,.22);border-radius:8px;
  padding:10px 16px;backdrop-filter:blur(4px)}
#c1{top:20px;left:20px}
#c2{top:20px;right:20px;text-align:right}
.lbl{font-size:10px;letter-spacing:.28em;color:#3d6250;margin-bottom:4px}
.num{font-size:38px;font-weight:bold;color:#ffd54a;line-height:1;
  text-shadow:0 0 20px rgba(255,213,74,.5);font-variant-numeric:tabular-nums}
#prog{font-size:12px;color:#7fe39a;letter-spacing:.14em}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.16em;color:#5f8a70;
  background:rgba(6,10,14,.6);border:1px solid rgba(127,227,154,.14);
  padding:8px 18px;border-radius:6px;white-space:nowrap}
/* crosshair */
#cross{position:absolute;top:50%;left:50%;width:16px;height:16px;
  margin:-8px 0 0 -8px;pointer-events:none}
#cross::before, #cross::after{
  content:"";position:absolute;background:rgba(127,227,154,.55)}
#cross::before{left:7px;top:0;width:2px;height:16px}
#cross::after{top:7px;left:0;height:2px;width:16px}

/* lock screen */
#lock{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  gap:18px;background:rgba(2,4,8,.72);backdrop-filter:blur(3px);
  cursor:pointer}
#lock.on{display:flex}
#lock .t{font-size:22px;letter-spacing:.4em;color:#ffd54a;
  text-shadow:0 0 30px rgba(255,213,74,.6)}
#lock .s{font-size:12px;color:#5f8a70;letter-spacing:.22em;line-height:2}
/* battle */
#battle{position:fixed;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,14,20,.55),rgba(2,4,8,.9))}
#battle.on{display:flex;animation:bf .25s ease}
@keyframes bf{from{opacity:0}to{opacity:1}}
.bw{display:flex;align-items:center;gap:60px}
.bs{display:flex;flex-direction:column;align-items:center;gap:8px}
.bs .nm{font-size:12px;letter-spacing:.3em;color:#5f8a70}
.bs .vv{font-size:76px;font-weight:bold;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 40px currentColor}
.bs.you .vv{color:#ffd54a}
.bs.foe .vv{color:#ff6b6b}
.vs{font-size:20px;letter-spacing:.3em;color:#3d6250}
/* modal */
#modal{position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  background:rgba(2,4,8,.9);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.box{background:#0a0e14;border:2px solid rgba(127,227,154,.3);
  border-radius:12px;padding:34px 44px;max-width:640px;text-align:center;
  animation:pp .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pp{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.box h1{font-size:15px;letter-spacing:.4em;color:#7fe39a;
  margin-bottom:18px;font-weight:normal}
.box .bd{font-size:14px;line-height:2.1;color:#88b39a;letter-spacing:.06em}
.box .hl{color:#ffd54a;font-size:26px;font-weight:bold}
.box .wn{color:#ff6b6b;font-size:26px;font-weight:bold}
.box .dm{color:#4a6b58}
.acts{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 28px;border:2px solid #3d6250;background:transparent;
  color:#7fe39a;font-family:inherit;font-size:13px;letter-spacing:.2em;
  cursor:pointer;border-radius:5px;transition:.16s}
.btn:hover{background:#7fe39a;color:#080d0a;border-color:#7fe39a}
.btn.am{border-color:#7a6520;color:#ffd54a}
.btn.am:hover{background:#ffd54a;color:#100c00;border-color:#ffd54a}
#banner{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);
  z-index:25;font-size:30px;letter-spacing:.4em;text-indent:.4em;
  color:#ffd54a;text-shadow:0 0 40px rgba(255,213,74,.7);
  pointer-events:none;opacity:0;white-space:nowrap}
#banner.on{animation:bn 2.2s ease-out}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="card" id="c1">
    <div class="lbl">勇 者</div>
    <div class="num" id="pnum">5</div>
  </div>
  <div class="card" id="c2">
    <div class="lbl">进 度</div>
    <div id="prog">山 脚</div>
  </div>
  <div id="cross"></div>
  <div id="hint">WASD 移动 · Q/E 转向 · 鼠标拖动转向 · P 暂停</div>
</div>
<div id="lock">
  <div class="t">点 击 开 始</div>
  <div class="s">W / S  前 后　·　A / D  左 右<br>鼠 标  转 向　·　E S C  退 出 鼠 标</div>
</div>
<div id="battle"><div class="bw">
  <div class="bs you"><div class="nm">你</div><div class="vv" id="byou">0</div></div>
  <div class="vs">VS</div>
  <div class="bs foe"><div class="nm" id="bfnm">它</div><div class="vv" id="bfoe">0</div></div>
</div></div>
<div id="banner"></div>
<div id="modal"></div>

<script src="three.min.js"></script>
<script src="controls.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE === 'undefined'){
  document.body.innerHTML='<div style="color:#ff6b6b;padding:40px;font-size:16px">3D 引 擎 加 载 失 败</div>';
  return;
}

/* ══════════════════════════════════════════════
   配置
   ══════════════════════════════════════════════ */
const MODE       = 'NG';
const START_PWR  = 5;
const BOSS_NUM   = 63;
const HAS_CHEST  = false;
const CHEST_BONUS= 0;

/* 怪物位置：堵在每段台阶的出口 */
const MON_DEFS = [
  { id:'shade', name:'黑 影',       num:3,  x: 0,  z: 28  },
  { id:'void',  name:'空 房 间',     num:4,  x: 22, z: 0   },
  { id:'echo',  name:'争吵的回声',   num:9,  x: 0,  z:-16  },
  { id:'door',  name:'关 上 的 门',  num:14, x:-11, z: 0   },
  { id:'knot',  name:'说不出口',     num:22, x: 0,  z: 6   }
];

/* ══════════════════════════════════════════════
   山体（7 层，每层缩进 6-12 米）
   ══════════════════════════════════════════════ */
const LAYERS = [
  { half:44, y:0  },
  { half:32, y:3  },
  { half:25, y:6  },
  { half:19, y:9  },
  { half:14, y:12 },
  { half:9,  y:15 },
  { half:5,  y:18 }
];

/* 6 组小台阶，每层之间一段，方位轮流 */
const STAIR_GROUPS = [
  { axis:'z', constPos:0, from: 40, to: 32, yF:0,  yT:3,  w:7 },   // L0→L1 南
  { axis:'x', constPos:0, from: 32, to: 25, yF:3,  yT:6,  w:7 },   // L1→L2 东
  { axis:'z', constPos:0, from:-25, to:-19, yF:6,  yT:9,  w:7 },   // L2→L3 北
  { axis:'x', constPos:0, from:-19, to:-14, yF:9,  yT:12, w:7 },   // L3→L4 西
  { axis:'z', constPos:0, from: 14, to: 9,  yF:12, yT:15, w:7 },   // L4→L5 南
  { axis:'x', constPos:0, from: 9,  to: 5,  yF:15, yT:18, w:7 }    // L5→L6 东
];

const STAIR_STEPS = 6;   // 每组台阶的级数
const STAIRS = [];

STAIR_GROUPS.forEach(g => {
  for(let i=0;i<STAIR_STEPS;i++){
    const t0 = i / STAIR_STEPS;
    const t1 = (i + 1) / STAIR_STEPS;
    const tc = (t0 + t1) / 2;
    const yTop = g.yF + (g.yT - g.yF) * t1;   // 该级顶面高度

    if(g.axis === 'z'){
      const zc = g.from + (g.to - g.from) * tc;
      const depth = Math.abs(g.to - g.from) / STAIR_STEPS;
      STAIRS.push({ x:g.constPos, z:zc, w:g.w, d:depth, y:yTop });
    }else{
      const xc = g.from + (g.to - g.from) * tc;
      const width = Math.abs(g.to - g.from) / STAIR_STEPS;
      STAIRS.push({ x:xc, z:g.constPos, w:width, d:g.w, y:yTop });
    }
  }
});

/* ══════════════════════════════════════════════
   站立高度查询
   ══════════════════════════════════════════════ */
function groundY(x, z){
  /* 台阶优先 */
  for(let i=0;i<STAIRS.length;i++){
    const s = STAIRS[i];
    if(Math.abs(x - s.x) <= s.w/2 + .35 &&
       Math.abs(z - s.z) <= s.d/2 + .35){
      return s.y;
    }
  }
  /* 山体层 */
  const d = Math.max(Math.abs(x), Math.abs(z));
  for(let i=LAYERS.length-1;i>=0;i--){
    if(d <= LAYERS[i].half) return LAYERS[i].y;
  }
  return 0;
}

/* ══════════════════════════════════════════════
   Three.js
   ══════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1e2a3a, 60, 200);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .5, 1200);
camera.position.set(0, 20, 60);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    uniforms:{
      top:{ value:new THREE.Color(0x050810) },
      bot:{ value:new THREE.Color(0x22303f) },
      off:{ value:80 }, ex:{ value:.7 }
    },
    vertexShader:`varying vec3 vP;
      void main(){ vP=(modelMatrix*vec4(position,1.)).xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform vec3 top; uniform vec3 bot;
      uniform float off; uniform float ex; varying vec3 vP;
      void main(){ float h=normalize(vP+off).y;
      gl_FragColor=vec4(mix(bot,top,pow(max(h,0.),ex)),1.);}`,
    side:THREE.BackSide, depthWrite:false
  })
);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0x8fb0d8, 0x101418, .85));
const sun = new THREE.DirectionalLight(0xc8dcf0, 1.15);
sun.position.set(-60, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -60;
sun.shadow.camera.right  =  60;
sun.shadow.camera.top    =  80;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.far    = 400;
scene.add(sun);

/* ══════════════════════════════════════════════
   世界
   ══════════════════════════════════════════════ */
const world = new THREE.Group();
scene.add(world);

/* 方格底座 */
const base = new THREE.Mesh(
  new THREE.BoxGeometry(120, 4, 120),
  new THREE.MeshStandardMaterial({ color:0x0d1319, roughness:1 })
);
base.position.y = -6;
base.receiveShadow = true;
world.add(base);

const grid = new THREE.GridHelper(120, 24, 0x3a5a4a, 0x18261e);
grid.position.y = -3.98;
world.add(grid);

/* 山体 */
const rockA = new THREE.MeshStandardMaterial({ color:0x3a4550, roughness:.96 });
const rockB = new THREE.MeshStandardMaterial({ color:0x2c3540, roughness:1 });

LAYERS.forEach((L, i) => {
  const bottom = i === 0 ? -4 : LAYERS[i-1].y;
  const h = L.y - bottom;
  if(h <= 0) return;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(L.half*2, h, L.half*2),
    i % 2 === 0 ? rockA : rockB
  );
  m.position.y = bottom + h/2;
  m.castShadow = true;
  m.receiveShadow = true;
  world.add(m);
});

/* 台阶 */
const stairMat = new THREE.MeshStandardMaterial({
  color:0x546a78, roughness:.9,
  emissive:0x0a1418, emissiveIntensity:.5 });

STAIRS.forEach(s => {
  const h = s.y + 1;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(s.w, h, s.d),
    stairMat
  );
  m.position.set(s.x, s.y - h/2, s.z);
  m.castShadow = true;
  m.receiveShadow = true;
  world.add(m);

  /* 边缘发光线 */
  if(s.y > .05){
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(s.w, .08, .08),
      new THREE.MeshStandardMaterial({
        color:0x8fb0c0, emissive:0x2a4a58, emissiveIntensity:1.2 })
    );
    line.position.set(s.x, s.y + .05, s.z + s.d/2 - .04);
    world.add(line);
  }
});

/* ══════════════════════════════════════════════
   玩家
   ══════════════════════════════════════════════ */
function box(w,h,d,c,e){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:c, roughness:.8,
      emissive: e||0x000000, emissiveIntensity: e?.8:0 }));
  m.castShadow = true;
  return m;
}

const player = new THREE.Group();
world.add(player);

const legL = box(.85,1.9,.85,0x33446b); legL.position.set(-.52,.95,0);
const legR = box(.85,1.9,.85,0x33446b); legR.position.set( .52,.95,0);
const torso = box(1.9,2.4,1.15,0x3f8a5b); torso.position.y = 3.1;
const belt = box(2,.32,1.25,0x8a6a3a);  belt.position.y  = 2;
const armL = box(.65,2.1,.65,0x3f8a5b); armL.position.set(-1.28,3.2,0);
const armR = box(.65,2.1,.65,0x3f8a5b); armR.position.set( 1.28,3.2,0);
const head = box(1.6,1.6,1.4,0xf2c9a0); head.position.y = 5.3;
const hair = box(1.8,.85,1.6,0x2b2233); hair.position.y = 6.05;
/* 面朝 -Z 方向：眼睛放在 -Z 面 */
const eyeL = box(.2,.28,.12,0x1a1014); eyeL.position.set(-.4,5.35,-.72);
const eyeR = eyeL.clone(); eyeR.position.x = .4;

const badge = box(.8,.6,.1,0x141a1e); badge.position.set(0,3.35,-.6);
const bScr = box(.42,.26,.05,0x7fe39a,0x7fe39a); bScr.position.z=-.06;
badge.add(bScr);

const swordG = new THREE.Group();
const blade = box(.26,4,.68,0xc8d0d8);
blade.position.y = 2.15;
const guard = box(1.05,.28,1.05,0x8a6a3a);
const grip  = box(.32,1,.32,0x5a3a1e); grip.position.y = -.66;
swordG.add(blade, guard, grip);
swordG.position.set(.1,-.2,.1);
armR.add(swordG);

player.add(legL,legR,torso,belt,armL,armR,head,hair,eyeL,eyeR,badge);
player.position.set(0, 0, 42);
player.targetY = 0;

/* ══════════════════════════════════════════════
   怪物造型
   ══════════════════════════════════════════════ */
function makeMon(type){
  const g = new THREE.Group();
  let anim = ()=>{};

  if(type === 'shade'){
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.2,1),
      new THREE.MeshStandardMaterial({ color:0x0a0d16, roughness:.85,
        emissive:0x121a2c, emissiveIntensity:.6 }));
    core.position.y = 2.8; core.castShadow = true;
    g.add(core);
    [-.8,.8].forEach(x => {
      const e = new THREE.Mesh(new THREE.SphereGeometry(.24,10,10),
        new THREE.MeshBasicMaterial({ color:0xeef4ff }));
      e.position.set(x,3.1,1.95); g.add(e);
    });
    anim = t => {
      core.position.y = 2.8 + Math.sin(t*1.5)*.4;
      const s = 1 + Math.sin(t*2.3)*.07;
      core.scale.set(s, 2-s, s);
    };
  }
  else if(type === 'void'){
    const fm = new THREE.MeshStandardMaterial({ color:0x3e6a52, roughness:.6,
      emissive:0x1c4028, emissiveIntensity:.7 });
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(.38,5,.38), fm);
    p1.position.set(-1.9,2.5,0);
    const p2 = p1.clone(); p2.position.x = 1.9;
    const tp = new THREE.Mesh(new THREE.BoxGeometry(4.2,.4,.4), fm);
    tp.position.y = 5;
    const bm = tp.clone(); bm.position.y = .2;
    [p1,p2,tp,bm].forEach(m => { m.castShadow = true; g.add(m); });
    const dark = new THREE.Mesh(new THREE.PlaneGeometry(3.4,4.6),
      new THREE.MeshBasicMaterial({ color:0x010302 }));
    dark.position.y = 2.6; g.add(dark);
    anim = t => {
      const p = 1 + Math.sin(t*2)*.1;
      dark.scale.set(p, 2-p, 1);
      fm.emissiveIntensity = .5 + Math.sin(t*1.6)*.25;
    };
  }
  else if(type === 'echo'){
    const mat = new THREE.MeshStandardMaterial({ color:0x8a3030, roughness:.65,
      emissive:0x5a1414, emissiveIntensity:.85 });
    const jL = new THREE.Mesh(new THREE.ConeGeometry(1.8,3.2,5), mat);
    jL.position.set(-2,2.8,0); jL.rotation.z = -Math.PI/2; jL.castShadow = true;
    const jR = new THREE.Mesh(new THREE.ConeGeometry(1.8,3.2,5), mat);
    jR.position.set(2,2.8,0); jR.rotation.z = Math.PI/2; jR.castShadow = true;
    g.add(jL,jR);
    const rings = [];
    for(let i=0;i<3;i++){
      const r = new THREE.Mesh(
        new THREE.TorusGeometry(1.1,.14,6,24),
        new THREE.MeshBasicMaterial({ color:0xffb0b0, transparent:true,
          opacity:.85, side:THREE.DoubleSide }));
      r.position.y = 2.8; r.rotation.x = Math.PI/2;
      r.userData.ph = i/3; g.add(r); rings.push(r);
    }
    anim = t => {
      jL.position.x = -2 + Math.sin(t*24)*.12;
      jR.position.x =  2 - Math.sin(t*24)*.12;
      rings.forEach(r => {
        const k = ((t*.85 + r.userData.ph)%1);
        const s = .5 + k*4;
        r.scale.set(s,s,1);
        r.material.opacity = (1-k)*.85;
      });
    };
  }
  else if(type === 'door'){
    const wm = new THREE.MeshStandardMaterial({ color:0x5a3f28, roughness:.92 });
    const d = new THREE.Mesh(new THREE.BoxGeometry(3.4,6,.75), wm);
    d.position.y = 3; d.castShadow = true; d.receiveShadow = true;
    g.add(d);
    const fm = new THREE.MeshStandardMaterial({ color:0x241a11, roughness:1 });
    [-1,1].forEach(s => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(.3,6.4,.85), fm);
      p.position.set(s*1.85,3.2,0); g.add(p);
    });
    const t = new THREE.Mesh(new THREE.BoxGeometry(4.2,.34,.85), fm);
    t.position.y = 6.3; g.add(t);
    const key = new THREE.Mesh(new THREE.PlaneGeometry(.75,1.35),
      new THREE.MeshBasicMaterial({ color:0xffd54a, transparent:true,
        opacity:.9 }));
    key.position.set(.5,3.2,.4); g.add(key);
    anim = t => {
      d.rotation.y = Math.sin(t*.8)*.03;
      key.material.opacity = .45 + Math.abs(Math.sin(t*1.5))*.5;
    };
  }
  else if(type === 'knot'){
    const k = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.75,.5,100,12),
      new THREE.MeshStandardMaterial({ color:0x6a2a5a, roughness:.55,
        emissive:0x3a1030, emissiveIntensity:.7, metalness:.15 }));
    k.position.y = 3; k.castShadow = true; g.add(k);
    const core = new THREE.Mesh(new THREE.SphereGeometry(.7,14,14),
      new THREE.MeshBasicMaterial({ color:0xe8b8e0 }));
    core.position.y = 3; g.add(core);
    anim = t => {
      k.rotation.y = t*.5;
      k.rotation.x = Math.sin(t*.6)*.3;
      k.scale.setScalar(1 + Math.sin(t*1.9)*.08);
      core.scale.setScalar(1 + Math.sin(t*2.6)*.22);
    };
  }

  return { group:g, anim };
}

/* ══════════════════════════════════════════════
   Boss
   ══════════════════════════════════════════════ */
function makeBoss(){
  const g = new THREE.Group();
  const dm = new THREE.MeshStandardMaterial({ color:0x07070b, roughness:.95,
    emissive:0x140a18, emissiveIntensity:.4 });

  const L = new THREE.Group();
  const lb = new THREE.Mesh(new THREE.CylinderGeometry(1.2,2.4,9,8), dm);
  lb.position.y = 4.5; lb.castShadow = true;
  const lh = new THREE.Mesh(new THREE.SphereGeometry(1.5,14,14), dm);
  lh.position.y = 10;
  L.add(lb, lh);
  L.position.set(-4.5, 0, -1); L.rotation.z = -.2;
  g.add(L);

  const R = new THREE.Group();
  R.add(lb.clone(), lh.clone());
  R.position.set(4.5, 0, -1); R.rotation.z = .2;
  g.add(R);

  const door = new THREE.Mesh(new THREE.BoxGeometry(2.6,5,.9),
    new THREE.MeshStandardMaterial({ color:0x120e14, roughness:1 }));
  door.position.y = 2.5; g.add(door);

  const beam = new THREE.Mesh(new THREE.PlaneGeometry(.5,4),
    new THREE.MeshBasicMaterial({ color:0xffd54a, transparent:true,
      opacity:.8, blending:THREE.AdditiveBlending }));
  beam.position.set(0,2.5,.5); g.add(beam);

  const glow = new THREE.Mesh(new THREE.CircleGeometry(9,32),
    new THREE.MeshBasicMaterial({ color:0xffd54a, transparent:true,
      opacity:.06, blending:THREE.AdditiveBlending }));
  glow.rotation.x = -Math.PI/2; glow.position.y = .06; g.add(glow);

  let defeated = false;
  const anim = t => {
    if(!defeated){
      L.position.x = -4.5 + Math.sin(t*.9)*.3;
      R.position.x =  4.5 - Math.sin(t*.9)*.3;
      L.rotation.z = -.2 + Math.sin(t*.9)*.05;
      R.rotation.z =  .2 - Math.sin(t*.9)*.05;
      beam.material.opacity = .55 + Math.abs(Math.sin(t*1.4))*.4;
    }else{
      L.position.x += (-9 - L.position.x)*.025;
      R.position.x += ( 9 - R.position.x)*.025;
      L.rotation.z += (-.95 - L.rotation.z)*.025;
      R.rotation.z += ( .95 - R.rotation.z)*.025;
      beam.material.opacity = Math.min(1, beam.material.opacity+.008);
      beam.scale.x = Math.min(7, beam.scale.x+.03);
      glow.material.opacity = Math.min(.45, glow.material.opacity+.005);
    }
  };
  return { group:g, anim, defeat(){ defeated = true; } };
}

/* ══════════════════════════════════════════════
   数字精灵
   ══════════════════════════════════════════════ */
function makeNumSprite(num, color){
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false }));
  sp.scale.set(4,2,1);
  sp.userData = { cv, ctx, tex, color: color||'#ffd54a', last:-1 };
  drawNum(sp, num);
  return sp;
}
function drawNum(sp, num){
  const u = sp.userData;
  const n = Math.round(num);
  if(n === u.last) return;
  u.last = n;
  const { cv, ctx, tex, color } = u;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.font = 'bold 96px "Courier New",monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 26;
  ctx.fillStyle = color;
  ctx.fillText(String(n), 128, 66);
  tex.needsUpdate = true;
}

/* ══════════════════════════════════════════════
   世界状态
   ══════════════════════════════════════════════ */
const ST = {
  pwr: START_PWR,
  phase: 'play',
  t: 0,
  mons: [],
  boss: null,
  battle: null,
  camShake: 0,
  atkT: 0,
  walkPhase: 0,
  ended: false
};

MON_DEFS.forEach(def => {
  const gy = groundY(def.x, def.z);
  const { group, anim } = makeMon(def.id);
  group.position.set(def.x, gy, def.z);
  world.add(group);

  const sp = makeNumSprite(def.num);
  sp.position.set(def.x, gy + 6.5, def.z);
  world.add(sp);

  ST.mons.push({
    id:def.id, name:def.name,
    baseNum:def.num, num:def.num,
    x:def.x, y:gy, z:def.z,
    group, anim, sprite:sp,
    dead:false, rising:false, isBoss:false
  });
});

const bossY = groundY(0, 0);
const bossObj = makeBoss();
bossObj.group.position.set(0, bossY, 0);
world.add(bossObj.group);

const bossSprite = makeNumSprite(BOSS_NUM, '#ff6b6b');
bossSprite.position.set(0, bossY + 13, 0);
bossSprite.scale.set(8,4,1);
world.add(bossSprite);

ST.boss = {
  id:'boss', name:'？ ？ ？',
  baseNum:BOSS_NUM, num:BOSS_NUM,
  x:0, y:bossY, z:0,
  group:bossObj.group, anim:bossObj.anim, defeat:bossObj.defeat,
  sprite:bossSprite, dead:false, rising:false, isBoss:true
};
ST.mons.push(ST.boss);

/* ══════════════════════════════════════════════
   粒子
   ══════════════════════════════════════════════ */
const parts = [];
function burst(pos, color, count){
  for(let i=0;i<count;i++){
    const s = .16 + Math.random()*.3;
    const m = new THREE.Mesh(new THREE.BoxGeometry(s,s,s),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 }));
    m.position.copy(pos);
    m.userData.v = new THREE.Vector3(
      (Math.random()-.5)*15, Math.random()*11+3, (Math.random()-.5)*15);
    m.userData.life = .8 + Math.random()*.8;
    m.userData.max = m.userData.life;
    world.add(m); parts.push(m);
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.userData.life -= dt;
    if(p.userData.life <= 0){
      world.remove(p);
      p.geometry.dispose(); p.material.dispose();
      parts.splice(i,1); continue;
    }
    p.userData.v.y -= 24*dt;
    p.position.addScaledVector(p.userData.v, dt);
    p.rotation.x += dt*7; p.rotation.z += dt*5;
    const k = p.userData.life / p.userData.max;
    p.material.opacity = k;
    p.scale.setScalar(k);
  }
}

/* ══════════════════════════════════════════════
   音效
   ══════════════════════════════════════════════ */
let actx = null;
function beep(f,d,type,vol){
  if(disposed||controls.paused||sfxVolume<=0)return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, actx.currentTime);
    g.gain.setValueAtTime((vol || .035)*sfxVolume, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime); o.stop(actx.currentTime + d);
  }catch(e){}
}
const sfx = {
  win:  ()=>{ beep(740,.08); setTimeout(()=>beep(1080,.14),80); },
  fail: ()=>beep(150,.22,'sawtooth',.05)
};

/* ══════════════════════════════════════════════
   鼠标转向
   ══════════════════════════════════════════════ */
let yaw=0;
const controls=createNumberHeroControls({canvas:renderer.domElement,getYaw:()=>yaw,setYaw:value=>{yaw=value;}});
let disposed=false,frameId=0,hostOptions={},saveClock=0,endDelay=-1,contactCooldown=0,sfxVolume=.8;
if(new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const $pnum   = document.getElementById('pnum');
const $prog   = document.getElementById('prog');
const $battle = document.getElementById('battle');
const $byou   = document.getElementById('byou');
const $bfoe   = document.getElementById('bfoe');
const $bfnm   = document.getElementById('bfnm');
const $banner = document.getElementById('banner');
const $modal  = document.getElementById('modal');

function banner(txt){
  $banner.textContent = txt;
  $banner.classList.remove('on');
  void $banner.offsetWidth;
  $banner.classList.add('on');
}

function flyNum(m, num){
  const v = m.group.position.clone();
  v.y += 5;
  v.project(camera);
  const x = (v.x*.5+.5)*innerWidth;
  const y = (-v.y*.5+.5)*innerHeight;
  const el = document.createElement('div');
  el.textContent = '+' + num;
  el.style.cssText = `position:fixed;left:${x}px;top:${y}px;z-index:15;
    font-size:40px;font-weight:bold;color:#ffd54a;
    text-shadow:0 0 26px rgba(255,213,74,.9);pointer-events:none;
    font-family:inherit;transform:translate(-50%,-50%);
    transition:all .95s cubic-bezier(.3,.9,.4,1);`;
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.left='95px'; el.style.top='85px';
    el.style.opacity='0';
    el.style.transform='translate(-50%,-50%) scale(1.7)';
  });
  setTimeout(()=>el.remove(),1000);
}

/* ══════════════════════════════════════════════
   玩家移动
   ══════════════════════════════════════════════ */
function updatePlayer(dt){
  const input=controls.move(dt),fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const mx=fx*input.y+rx*input.x,mz=fz*input.y+rz*input.x;
  const steps=Math.max(1,Math.ceil(Math.hypot(mx,mz)*11.5*dt/.14));
  const dx=mx*11.5*dt/steps,dz=mz*11.5*dt/steps;
  let moving=false;
  function attempt(nx,nz){nx=Math.max(-46,Math.min(46,nx));nz=Math.max(-46,Math.min(46,nz));const y=groundY(nx,nz);
    if(y-player.targetY>.56)return false;
    if(Math.hypot(nx-player.position.x,nz-player.position.z)>.0001)moving=true;
    player.position.x=nx;player.position.z=nz;player.targetY=y;return true;}
  for(let i=0;i<steps;i++){if(!attempt(player.position.x+dx,player.position.z+dz)){attempt(player.position.x+dx,player.position.z);attempt(player.position.x,player.position.z+dz);}}
  player.rotation.y=yaw;
  player.position.y+=(player.targetY-player.position.y)*(1-Math.exp(-dt*18));
  /* 行走动画 */
  ST.walkPhase += dt * (moving ? 11 : 2.2);
  const sw = Math.sin(ST.walkPhase) * (moving ? .72 : .035);
  legL.rotation.x =  sw;
  legR.rotation.x = -sw;
  armL.rotation.x = -sw*.7;
  armR.rotation.x =  sw*.7;

  const bob = moving
    ? Math.abs(Math.sin(ST.walkPhase))*.13
    : Math.sin(ST.walkPhase)*.05;

  torso.position.y = 3.1 + bob;
  belt.position.y  = 2   + bob;
  head.position.y  = 5.3 + bob;
  hair.position.y  = 6.05 + bob;
  eyeL.position.y  = 5.35 + bob;
  eyeR.position.y  = 5.35 + bob;
  badge.position.y = 3.35 + bob;

  /* 挥剑 */
  if(ST.atkT > 0){
    ST.atkT = Math.max(0, ST.atkT - dt*3.4);
    const k = Math.sin((1 - ST.atkT)*Math.PI);
    armR.rotation.x = -k*2.6;
    armR.rotation.z = -k*.55;
  }else{
    armR.rotation.z = 0;
  }
}

/* ══════════════════════════════════════════════
   怪物更新
   ══════════════════════════════════════════════ */
function updateMons(dt){
  ST.mons.forEach(m => {
    if(m.dead) return;
    m.anim(ST.t);
  });
}

/* ══════════════════════════════════════════════
   碰撞检测
   ══════════════════════════════════════════════ */
function checkTouch(){
  if(ST.phase !== 'play' || ST.ended || contactCooldown>0) return;
  for(const m of ST.mons){
    if(m.dead) continue;
    const d  = Math.hypot(player.position.x - m.x, player.position.z - m.z);
    const dy = Math.abs(player.position.y - m.y);
    const R  = m.isBoss ? 8 : 3.6;
    if(d < R && dy < 4.5){ startBattle(m); return; }
  }
}

/* ══════════════════════════════════════════════
   战斗
   ══════════════════════════════════════════════ */
function startBattle(m){
  controls.clear();
  ST.phase = 'battle';
  ST.battle = { m, t:0, stage:0, win:false };

  $byou.textContent = ST.pwr;
  $bfoe.textContent = Math.round(m.num);
  $bfnm.textContent = m.name;
  $battle.classList.add('on');
  ST.atkT = 1;
}

function resolveBattle(b){
  const m = b.m;
  const foe = Math.round(m.num);
  const win = ST.pwr > foe;
  b.win = win;

  if(win){
    m.dead = true;
    m.group.visible = m.isBoss;
    m.sprite.visible = false;

    burst(m.group.position.clone()
      .setY(m.group.position.y + (m.isBoss ? 6 : 2.5)),
      0xffd54a, m.isBoss ? 80 : 26);
    sfx.win();
    ST.camShake = m.isBoss ? 1 : .35;

    if(m.isBoss){
      m.defeat();
    }else{
      ST.pwr += foe;
      $pnum.textContent = ST.pwr;
      banner('+' + foe);
      setTimeout(()=>flyNum(m, foe), 180);
    }
  }else{
    sfx.fail();
    ST.camShake = .85;
    const dx = player.position.x - m.x;
    const dz = player.position.z - m.z;
    const l = Math.hypot(dx,dz) || 1;
    player.position.x += dx/l * 3.5;
    player.position.z += dz/l * 3.5;
    player.targetY = groundY(player.position.x, player.position.z);
  }
}

function endBattle(b){
  $battle.classList.remove('on');
  ST.battle = null;
  ST.phase = 'play';
  contactCooldown=1.2;controls.clear();

  if(b.m.isBoss){
    ST.ended = true;
    ST.phase = 'over';
    endDelay=b.win?2.6:.9;
  }
  hostOptions.onProgress?.(snapshot());
}

/* ══════════════════════════════════════════════
   相机（跟 yaw 一致，第三人称背后视角）
   ══════════════════════════════════════════════ */
const camP = new THREE.Vector3();
const camL = new THREE.Vector3();
let camY = 0;

function updateCam(dt, instant){
  const px = player.position.x;
  const py = player.position.y;
  const pz = player.position.z;

  /* 角色背后方向 */
  const bx = Math.sin(yaw);
  const bz = Math.cos(yaw);

  const dist = 14;
  const height = 8;

  camP.set(px + bx * dist, py + height, pz + bz * dist);
  camL.set(px, py + 2.5, pz);

  if(instant){
    camera.position.copy(camP);
    camY = camP.y;
  }else{
    camera.position.lerp(camP, 1 - Math.pow(.0035, dt));
  }

  /* 相机不能穿进地形 */
  const cg = groundY(camera.position.x, camera.position.z);
  if(camera.position.y < cg + 2.5){
    camera.position.y = cg + 2.5;
  }

  if(ST.camShake > 0){
    ST.camShake = Math.max(0, ST.camShake - dt*2.6);
    const a = ST.camShake*.55;
    camera.position.x += (Math.random()-.5)*a;
    camera.position.y += (Math.random()-.5)*a;
  }
  camera.lookAt(camL);
}

/* ══════════════════════════════════════════════
   进度文字
   ══════════════════════════════════════════════ */
function updateProg(){
  const y = player.position.y;
  const alive = ST.mons.filter(m => !m.dead && !m.isBoss).length;

  let s;
  if(y < .5)       s = '山 脚';
  else if(y < 3.5) s = '第 一 段';
  else if(y < 6.5) s = '第 二 段';
  else if(y < 9.5) s = '第 三 段';
  else if(y < 12.5)s = '第 四 段';
  else if(y < 15.5)s = '第 五 段';
  else             s = '山 顶';

  if(!ST.ended) s += alive > 0 ? ' · 剩 ' + alive : ' · 面 前 没 有 了';
  $prog.textContent = s;
}

/* ══════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════ */
let lastT = performance.now();

function loop(){
  if(disposed)return;frameId=requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastT)/1000, .05);
  lastT = now;
  if(controls.paused){renderer.render(scene,camera);return;}
  contactCooldown=Math.max(0,contactCooldown-dt);
  if(endDelay>=0){endDelay-=dt;if(endDelay<0){ST.boss.dead?winEnd():failEnd();}}
  saveClock+=dt;if(saveClock>1){saveClock=0;if(ST.phase==='play')hostOptions.onProgress?.(snapshot());}
  ST.t += dt;

  if(ST.phase === 'play'){
    updatePlayer(dt);
    updateMons(dt);
    checkTouch();
    updateProg();
  }else if(ST.phase === 'battle'){
    const b = ST.battle;
    b.t += dt;
    if(b.stage === 0 && b.t > .95){ b.stage = 1; resolveBattle(b); }
    if(b.stage === 1 && b.t > 2.5){ b.stage = 2; endBattle(b); }
    updateMons(dt);
  }else{
    updateMons(dt);
  }

  updateParts(dt);
  updateCam(dt, false);
  renderer.render(scene, camera);
}

/* ══════════════════════════════════════════════
   结局
   ══════════════════════════════════════════════ */
function failEnd(){
  const gap = BOSS_NUM - ST.pwr;

  $modal.innerHTML = `
    <div class="box">
      <h1>M E M O R Y　C O M P L E T E</h1>
      <div class="bd">
        你爬到了山顶。<br><br>
        你　<span class="hl">${ST.pwr}</span><br>
        它　<span class="wn">${BOSS_NUM}</span><br><br>
        <span class="wn" style="font-size:16px">差 ${gap}。</span><br><br>
        <span class="dm">不是因为你不够努力。</span><br>
        <span class="dm">是这个存档里的你，</span><br>
        <span class="dm">就只有这么多。</span>
      </div>
      <div class="acts">
        <button class="btn am" id="nx">打 开 二 周 目</button>
        <button class="btn" id="retry">重新攀登</button>
      </div>
    </div>`;
  $modal.classList.add('on');
  setTimeout(()=>beep(520,.1,'triangle',.05), 200);
  setTimeout(()=>beep(660,.1,'triangle',.05), 340);
  setTimeout(()=>beep(880,.26,'triangle',.05), 480);

  document.getElementById('nx').textContent='继续故事';document.getElementById('nx').onclick=finishChapter;
  document.getElementById('retry').onclick=()=>{hostOptions.onProgress?.(null);location.reload();};
}

function winEnd(){

  $modal.innerHTML = `
    <div class="box" style="border-color:rgba(255,213,74,.45)">
      <h1 style="color:#ffd54a">天　亮　了</h1>
      <div class="bd">
        两个剪影松开了。<br>
        他们各自转身，走了。<br><br>
        底下那扇小门还开着。<br>
        门缝里的光，比刚才大了一点。
      </div>
      <div class="acts">
        <button class="btn am" id="ag">再 走 一 次</button>
      </div>
    </div>`;
  $modal.classList.add('on');
  document.getElementById('ag').textContent='继续故事';document.getElementById('ag').onclick=finishChapter;
}


function snapshot(){return {kind:'number-hero-v1',playthrough:1,power:ST.pwr,position:{x:player.position.x,z:player.position.z,yaw:yaw},monsters:ST.mons.map(m=>({id:m.id,dead:m.dead,num:m.num})),ended:ST.ended,sword:false,chestOpened:false};}
let delivered=false;
function finishChapter(){if(delivered)return;delivered=true;hostOptions.onProgress?.(snapshot());hostOptions.onComplete?.({success:true,score:ST.pwr,flags:{numberHeroComplete:true,numberHeroSword:false,numberHeroOutcome:ST.boss.dead?'VICTORY':'FIRST_LIMIT'}});}
window.NumberHero={
 start(options={}){hostOptions=options;sfxVolume=Math.max(0,Math.min(1,Number(options.sfxVolume??.8)));const saved=options.save;
  if(saved?.kind==='number-hero-v1'&&saved.playthrough===1&&Number.isFinite(saved.power)&&saved.power>=START_PWR&&Number.isFinite(saved.position?.x)&&Number.isFinite(saved.position?.z)){
   ST.pwr=saved.power;player.position.x=Math.max(-46,Math.min(46,saved.position.x));player.position.z=Math.max(-46,Math.min(46,saved.position.z));yaw=Number.isFinite(saved.position.yaw)?saved.position.yaw:yaw;player.targetY=groundY(player.position.x,player.position.z);
   for(const item of saved.monsters||[]){const m=ST.mons.find(m=>m.id===item.id);if(!m)continue;m.dead=!!item.dead;m.num=Number.isFinite(item.num)?Math.max(m.baseNum,item.num):m.baseNum;m.group.visible=!m.dead||m.isBoss;m.sprite.visible=!m.dead;drawNum(m.sprite,m.num);}

   ST.ended=!!saved.ended;if(ST.ended){ST.phase='over';controls.begin();ST.boss.dead?winEnd():failEnd();}
  }
  player.position.y=player.targetY;$pnum.textContent=ST.pwr;updateCam(0,true);
 },getSaveData:snapshot,setHostPaused:value=>controls.setHostPaused(value),
 dispose(){disposed=true;cancelAnimationFrame(frameId);controls.dispose();actx?.close();scene.traverse(o=>{o.geometry?.dispose();for(const material of (Array.isArray(o.material)?o.material:[o.material])){material?.map?.dispose();material?.dispose();}});renderer.dispose();}
};

/* ══════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════ */
$pnum.textContent = ST.pwr;
player.targetY = groundY(player.position.x, player.position.z);
player.position.y = player.targetY;
updateCam(0, true);
renderer.render(scene, camera);

frameId=requestAnimationFrame(loop);

})();
</script>
