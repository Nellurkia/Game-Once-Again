<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数字勇者 · 爬山 · 二周目</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
  font-family:"Courier New",ui-monospace,monospace;
  user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased}
#cv{display:block;position:fixed;inset:0}

/* ═══════ HUD ═══════ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#numBox{position:absolute;top:18px;left:18px;
  background:rgba(6,10,14,.72);border:1px solid rgba(127,227,154,.22);
  border-radius:9px;padding:8px 16px;backdrop-filter:blur(4px)}
.lbl{font-size:9px;letter-spacing:.28em;color:#3d6250;margin-bottom:3px}
#pNum{font-size:40px;font-weight:bold;color:#ffd54a;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 22px rgba(255,213,74,.6);transition:transform .12s}
#pNum.pop{transform:scale(1.32)}
#runTag{position:absolute;top:18px;right:18px;
  background:rgba(6,10,14,.72);border:1px solid rgba(127,227,154,.22);
  border-radius:9px;padding:8px 16px;text-align:right;backdrop-filter:blur(4px)}
#runTag .t{font-size:12px;color:#7fe39a;letter-spacing:.16em}
#runTag .s{font-size:10px;color:#4a6b58;letter-spacing:.1em;margin-top:3px}

/* 进度轨 */
#track{position:absolute;right:22px;top:110px;bottom:110px;width:8px;
  background:rgba(6,10,14,.6);border:1px solid rgba(127,227,154,.18);
  border-radius:4px;overflow:visible}
#tFill{position:absolute;bottom:0;left:0;right:0;border-radius:4px;
  background:linear-gradient(0deg,#2a6a4a,#7fe39a);transition:height .1s}
#tBoss{position:absolute;left:-9px;right:-9px;height:3px;background:#ff6b6b;
  box-shadow:0 0 12px #ff6b6b;border-radius:2px}
#tMe{position:absolute;left:-11px;right:-11px;height:9px;border-radius:3px;
  background:#ffd54a;box-shadow:0 0 14px #ffd54a;transition:bottom .1s}
#dist{position:absolute;right:60px;top:50%;transform:translateY(-50%);
  font-size:11px;color:#5f8a70;letter-spacing:.1em;white-space:nowrap;
  background:rgba(6,10,14,.6);padding:5px 10px;border-radius:5px}

#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.14em;color:#5f8a70;
  background:rgba(6,10,14,.65);border:1px solid rgba(127,227,154,.14);
  padding:7px 18px;border-radius:6px;white-space:nowrap}
#hint b{color:#7fe39a;font-weight:normal}

/* ═══════ 遮罩层 ═══════ */
.overlay{position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  background:rgba(3,5,9,.9);backdrop-filter:blur(4px)}
.overlay.on{display:flex}
.box{background:#0a0e14;border:2px solid rgba(127,227,154,.32);
  border-radius:14px;padding:34px 46px;max-width:660px;text-align:center;
  animation:pop .4s cubic-bezier(.3,1.4,.5,1);
  box-shadow:0 0 90px -24px rgba(127,227,154,.5)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}
  to{opacity:1;transform:none}}
.box h1{font-size:15px;letter-spacing:.42em;color:#7fe39a;
  margin-bottom:20px;font-weight:normal}
.box .bd{font-size:14px;line-height:2.15;color:#88b39a;letter-spacing:.06em}
.box .hl{color:#ffd54a;font-size:30px;font-weight:bold}
.box .wn{color:#ff6b6b;font-size:30px;font-weight:bold}
.box .dm{color:#4a6b58}
.acts{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 30px;border:2px solid #3d6250;background:transparent;
  color:#7fe39a;font-family:inherit;font-size:13px;letter-spacing:.2em;
  cursor:pointer;border-radius:6px;transition:.16s}
.btn:hover{background:#7fe39a;color:#080d0a;border-color:#7fe39a}
.btn.am{border-color:#7a6520;color:#ffd54a}
.btn.am:hover{background:#ffd54a;color:#100c00;border-color:#ffd54a}
.btn.off{opacity:.32;cursor:not-allowed}
.btn.off:hover{background:transparent;color:#7fe39a;border-color:#3d6250}

/* 标题 */
#menu{position:fixed;inset:0;z-index:40;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:linear-gradient(180deg,#0b1220 0%,#05070c 100%);text-align:center;
  padding:24px}
#menu.off{display:none}
#menu .pre{font-size:11px;letter-spacing:.5em;color:#3d6250}
#menu h1{font-size:44px;letter-spacing:.34em;text-indent:.34em;
  color:#7fe39a;text-shadow:0 0 40px rgba(127,227,154,.65);font-weight:normal}
#menu .sub{font-size:11px;letter-spacing:.3em;color:#4a6b58;margin-bottom:10px}
#menuList{display:flex;flex-direction:column;gap:10px}
.mbtn{padding:13px 40px;border:2px solid #3d6250;background:transparent;
  color:#7fe39a;font-family:inherit;font-size:13px;letter-spacing:.24em;
  cursor:pointer;border-radius:7px;transition:.16s;min-width:280px}
.mbtn:hover{background:#7fe39a;color:#080d0a;border-color:#7fe39a}
.mbtn.am{border-color:#7a6520;color:#ffd54a}
.mbtn.am:hover{background:#ffd54a;color:#100c00;border-color:#ffd54a}
.mbtn.dim{border-color:#243a2c;color:#4a6b58;font-size:11px;
  padding:9px 22px;min-width:0;letter-spacing:.16em}
.mbtn.dim:hover{background:#4a6b58;color:#080d0a;border-color:#4a6b58}

.box{width:min(660px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
#pauseBtn{position:fixed;z-index:15;top:18px;left:180px;pointer-events:auto;padding:7px 12px;border:1px solid #69806c88;border-radius:7px;background:#08100bd9;color:#b8d9c0;font:12px "Courier New",monospace}
#pauseScreen{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:#030509d9;color:#d5e4cf;text-align:center;padding:24px}
#pauseScreen.on{display:flex}#pauseScreen .pauseBox{max-width:520px;padding:30px;background:#0a0e14;border:1px solid #7fe39a66;border-radius:12px;line-height:2}
#pauseScreen button{margin-top:18px;padding:10px 22px;background:#213c2c;color:#d5e4cf;border:1px solid #7fe39a88;border-radius:6px;font:inherit}
#touchPad{display:none;position:fixed;z-index:16;left:18px;right:18px;bottom:max(16px,env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}
#touchPad .touchGroup{display:flex;gap:9px;pointer-events:auto}
#touchPad button{min-width:96px;min-height:84px;padding:8px 12px;border:1px solid #7fe39a66;border-radius:14px;background:#07100bc9;color:#c8e6ca;font:24px "Courier New",monospace;touch-action:none}
#touchPad button:active{background:#31513b}
.touchHint{align-self:center;max-width:170px;padding:9px 12px;border-radius:9px;background:#07100ba8;color:#b8c7b9;font:12px/1.5 "Microsoft YaHei",sans-serif;text-align:center}
@media(pointer:coarse){#touchPad{display:flex}#hint{display:none}}
@media(max-width:520px){#menu{gap:9px;padding:14px}#menu h1{font-size:clamp(28px,8vw,44px)}.mbtn{min-width:min(280px,calc(100vw - 48px));padding:11px 20px}.box{padding:23px 20px}.box .bd{font-size:13px}#track{right:9px}#dist{right:36px;font-size:10px}}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div id="numBox">
    <div class="lbl">勇 者</div>
    <div id="pNum">5</div>
  </div>
  <div id="runTag">
    <div class="t" id="rtT">一 周 目</div>
    <div class="s" id="rtS">旧 存 档</div>
  </div>
  <div id="track">
    <div id="tFill"></div>
    <div id="tBoss"></div>
    <div id="tMe"></div>
  </div>
  <div id="dist">距离 BOSS 1000m</div>
  <div id="hint"><b>A / D</b> 左右　·　<b>W</b> 加速　·　<b>S</b> 减速　·　鼠标也可操控</div>
</div>

<div class="overlay" id="modal"></div>

<button id="pauseBtn" type="button">暂停 · P</button><div id="pauseScreen"><div class="pauseBox">攀登已暂停<br><small>稍作休息，准备好后继续。</small><br><button type="button">继续攀登</button></div></div><div id="touchPad"><div class="touchGroup"><button type="button" data-key="a" aria-label="向左移动">←</button><button type="button" data-key="d" aria-label="向右移动">→</button></div><span class="touchHint">按住左右躲避<br>角色会自动攀登</span></div><div id="menu">
  <div class="pre">┼ ┼ ┼</div>
  <h1>数字勇者</h1>
  <div class="sub">爬 山 · 二 周 目</div>
  <div id="menuList"></div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════
   画布
   ══════════════════════════════════════════════════════ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ══════════════════════════════════════════════════════
   常量
   ══════════════════════════════════════════════════════ */
const SCALE     = 10;          // 1 世界单位 = 10 像素
const TRAIL_HW  = 9;           // 山道半宽（单位）
const LANE_X    = [-5.5, 0, 5.5];
const PW = 2.4, PH = 4.6;
const BOSS_Y    = 1000;
const CAM_ANCH  = 0.74;
const X_LIMIT   = TRAIL_HW - PW / 2 - 0.2;

let camY = 0;
function sy(y){ return H * CAM_ANCH - (y - camY) * SCALE; }
function sx(x){ return W / 2 + x * SCALE; }

/* ══════════════════════════════════════════════════════
   两种运行配置
   ══════════════════════════════════════════════════════ */
const RUNS = {
  NG: {
    label:'一 周 目', sub:'旧 存 档',
    startNum: 5, bossNum: 63, climb: 26, hasChest: false,
    skyTop:'#050810', skyBot:'#26364a',
    rockA:'#1c242c', rockB:'#151b22',
    trailA:'#212a32', trailB:'#3a4750',
    edge:'#5f8a72', accent:'#7fe39a'
  },
  NGP: {
    label:'二 周 目', sub:'勇 气 之 剑',
    startNum: 5, chestBonus: 20, bossNum: 105, climb: 34, hasChest: true,
    skyTop:'#1a1024', skyBot:'#4a3222',
    rockA:'#2c2218', rockB:'#1f1810',
    trailA:'#332a1c', trailB:'#4d3d28',
    edge:'#c9a24a', accent:'#ffd54a'
  }
};

/* ══════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════ */
let run = 'NG';
let R = RUNS.NG;
let P = null;
let ents = [], parts = [], floats = [], rocks = [];
let state = 'title';
let stateT = 0, T = 0;
let shakeAmt = 0, flashAmt = 0;
let clash = null;
let stunLeft = 0;
let chestSeq = null;
let bossSeq = null;
let fadeAmt = 0;
let ngCleared = false, ngpCleared = false;
let chestOpened = false;

const keys = {};
let mActive = false, mTargetX = 0;

/* ══════════════════════════════════════════════════════
   音效
   ══════════════════════════════════════════════════════ */
let actx = null;
let sfxVolume = 1;
function beep(f, d, type, vol){
  if(sfxVolume<=0)return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, actx.currentTime);
    g.gain.setValueAtTime((vol || .035)*sfxVolume, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime); o.stop(actx.currentTime + d);
  }catch(e){}
}
const SFX = {
  clash: ()=>beep(420,.09,'square',.045),
  win:   ()=>{ beep(720,.07); setTimeout(()=>beep(1060,.14),80); },
  bad:   ()=>{ beep(160,.22,'sawtooth',.05); },
  gold:  ()=>{ beep(880,.08,'triangle',.05);
               setTimeout(()=>beep(1240,.16,'triangle',.05),80); },
  chest: ()=>{ beep(520,.12,'triangle',.05);
               setTimeout(()=>beep(780,.14,'triangle',.05),140);
               setTimeout(()=>beep(1180,.32,'triangle',.05),300); },
  fail:  ()=>beep(120,.7,'sawtooth',.055),
  win2:  ()=>{ beep(660,.14,'triangle',.05);
               setTimeout(()=>beep(880,.14,'triangle',.05),200);
               setTimeout(()=>beep(1240,.5,'triangle',.05),400); }
};

/* ══════════════════════════════════════════════════════
   输入
   ══════════════════════════════════════════════════════ */
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k==='p'&&!e.repeat){setManualPause(!manualPaused);e.preventDefault();return;}
  if(manualPaused||hostPaused)return;
  keys[k] = true;
  if(['w','a','s','d',' '].includes(k)) e.preventDefault();
  if(k === 'r' && state !== 'title'){ startRun(run); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

cv.addEventListener('mousemove', e=>{
  mActive = true;
  mTargetX = Math.max(-X_LIMIT, Math.min(X_LIMIT, (e.clientX - W/2) / SCALE));
});
cv.addEventListener('mouseleave', ()=>{ mActive = false; });

/* ══════════════════════════════════════════════════════
   建关
   ══════════════════════════════════════════════════════ */
function buildCourse(){
  ents = [];
  chestOpened = false;

  if(run === 'NG'){
    /* 一周目：怪物堵满三条道（必须打），红门错开一条道（要躲） */
    const rows = [
      { y:130, t:'mon',   id:'shade', num:3  },
      { y:215, t:'later', lane:0 },
      { y:310, t:'mon',   id:'void',  num:4  },
      { y:395, t:'later', lane:2 },
      { y:490, t:'mon',   id:'echo',  num:9  },
      { y:575, t:'later', lane:0 },
      { y:670, t:'mon',   id:'door',  num:14 },
      { y:755, t:'later', lane:2 },
      { y:850, t:'mon',   id:'knot',  num:22 },
      { y:930, t:'later', lane:0 }
    ];
    for(const r of rows){
      if(r.t === 'mon'){
        for(let i=0;i<3;i++){
          ents.push({
            kind:'mon', id:r.id, num:r.num,
            x:LANE_X[i], y:r.y, w:5.0, h:6.2,
            row:r.y, dead:false, hit:false, t:Math.random()*6
          });
        }
      }else{
        ents.push({
          kind:'later', x:LANE_X[r.lane], y:r.y, w:6.0, h:5.0,
          dead:false, hit:false, t:Math.random()*6
        });
      }
    }
  }else{
    /* 二周目：三选一 —— 怪物 / 金门 / 金门 */
    const rows = [
      { y:250, cells:[ {t:'mon',id:'shade',num:5}, {t:'gold',v:12}, {t:'gold',v:9}  ] },
      { y:400, cells:[ {t:'gold',v:14}, {t:'mon',id:'void',num:7}, {t:'gold',v:11} ] },
      { y:550, cells:[ {t:'mon',id:'echo',num:15}, {t:'gold',v:16}, {t:'gold',v:13} ] },
      { y:700, cells:[ {t:'gold',v:18}, {t:'mon',id:'door',num:23}, {t:'gold',v:15} ] },
      { y:850, cells:[ {t:'mon',id:'knot',num:36}, {t:'gold',v:21}, {t:'gold',v:17} ] }
    ];
    for(const r of rows){
      r.cells.forEach((c, i) => {
        if(c.t === 'mon'){
          ents.push({
            kind:'mon', id:c.id, num:c.num,
            x:LANE_X[i], y:r.y, w:5.0, h:6.2,
            row:r.y, dead:false, hit:false, t:Math.random()*6
          });
        }else{
          ents.push({
            kind:'gold', v:c.v, x:LANE_X[i], y:r.y, w:5.0, h:5.0,
            dead:false, hit:false, t:Math.random()*6
          });
        }
      });
    }
    /* 宝箱 */
    ents.push({
      kind:'chest', x:0, y:92, w:5.2, h:3.6,
      dead:false, hit:false, t:0
    });
  }

  /* BOSS */
  ents.push({
    kind:'boss', x:0, y:BOSS_Y, w:18, h:14,
    dead:false, hit:false, t:0
  });
}

function buildRocks(){
  rocks = [];
  for(let i=0;i<220;i++){
    rocks.push({
      y: Math.random()*1160 - 40,
      side: Math.random() < 0.5 ? -1 : 1,
      off: 0.2 + Math.random()*2.2,
      w: 0.5 + Math.random()*2.0,
      h: 0.4 + Math.random()*1.6,
      a: 0.05 + Math.random()*0.14
    });
  }
}

/* ══════════════════════════════════════════════════════
   特效
   ══════════════════════════════════════════════════════ */
function burst(x, y, n, color){
  for(let i=0;i<n;i++){
    parts.push({
      x, y,
      vx:(Math.random()-.5)*16,
      vy:(Math.random()*12 + 2),
      life: 0.7 + Math.random()*0.8,
      max: 0.7 + Math.random()*0.8,
      s: 0.12 + Math.random()*0.26,
      c: color
    });
  }
  if(parts.length > 420) parts.splice(0, parts.length - 420);
}

function float(x, y, txt, color, size){
  floats.push({ x, y, txt, color, size: size || 1.0, life: 1.25, max: 1.25 });
}

function shake(a){ shakeAmt = Math.max(shakeAmt, a); }
function flash(a){ flashAmt = Math.max(flashAmt, a); }

/* ══════════════════════════════════════════════════════
   开局 / 重开
   ══════════════════════════════════════════════════════ */
function startRun(which){
  if(hostOptions)try{window.parent.playGameSfx?.('select');}catch{}
  if(hostOptions)which=hostOptions.playthrough===1?'NG':'NGP';
  heroStopHits=0;heroStopTrackingKnown=true;
  run = which;
  R = RUNS[which];
  P = { x: 0, y: 0, num: R.startNum, sword: false, popT: 0 };
  camY = 0;
  parts = []; floats = [];
  state = 'run'; stateT = 0; T = 0;
  clash = null; stunLeft = 0;
  chestSeq = null; bossSeq = null;
  fadeAmt = 0; shakeAmt = 0; flashAmt = 0;
  mActive = false;

  buildCourse();
  buildRocks();
  document.getElementById('menu').classList.add('off');
  document.getElementById('modal').classList.remove('on');
  syncHUD();
  syncTrack();
  reportHeroProgress();
}

/* ══════════════════════════════════════════════════════
   HUD
   ══════════════════════════════════════════════════════ */
const $pNum = document.getElementById('pNum');
const $rtT  = document.getElementById('rtT');
const $rtS  = document.getElementById('rtS');
const $tFill= document.getElementById('tFill');
const $tBoss= document.getElementById('tBoss');
const $tMe  = document.getElementById('tMe');
const $dist = document.getElementById('dist');

function syncHUD(){
  $pNum.textContent = Math.max(0, Math.round(P.num));
  $rtT.textContent = R.label;
  $rtS.textContent = R.sub;
}
function popNum(){
  $pNum.classList.remove('pop');
  void $pNum.offsetWidth;
  $pNum.classList.add('pop');
}
function syncTrack(){
  const pct = Math.max(0, Math.min(1, P.y / BOSS_Y)) * 100;
  $tFill.style.height = pct + '%';
  $tMe.style.bottom = pct + '%';
  $tBoss.style.bottom = '100%';
  const left = Math.max(0, BOSS_Y - P.y);
  $dist.textContent = left < 1
    ? 'BOSS'
    : '距离 BOSS ' + Math.round(left) + 'm';
}

/* ══════════════════════════════════════════════════════
   更新：玩家
   ══════════════════════════════════════════════════════ */
function updatePlayer(dt){
  if(state !== 'run') return;

  let mv = 1;
  if(keys['s'] || keys['arrowdown']) mv = 0.34;
  if(keys['w'] || keys['arrowup'])   mv = 1.55;

  const keySteer = keys['a'] || keys['d'] ||
                   keys['arrowleft'] || keys['arrowright'];
  if(keySteer) mActive = false;

  if(mActive){
    P.x += (mTargetX - P.x) * Math.min(1, dt*10);
  }else{
    if(keys['a'] || keys['arrowleft'])  P.x -= 19 * dt;
    if(keys['d'] || keys['arrowright']) P.x += 19 * dt;
  }
  P.x = Math.max(-X_LIMIT, Math.min(X_LIMIT, P.x));

  P.y += R.climb * mv * dt;

  if(P.popT > 0) P.popT = Math.max(0, P.popT - dt);
}

/* ══════════════════════════════════════════════════════
   更新：碰撞检测
   ══════════════════════════════════════════════════════ */
function checkHit(){
  if(state !== 'run') return;

  for(const e of ents){
    if(e.dead || e.hit) continue;

    if(e.kind === 'boss'){
      if(P.y + PH >= e.y - 9){ e.hit = true; onBoss(); }
      continue;
    }

    /* 纵向重叠 */
    if(P.y + PH < e.y - e.h/2) continue;
    if(P.y > e.y + e.h/2) continue;
    /* 横向重叠 */
    if(Math.abs(P.x - e.x) > (PW + e.w) / 2) continue;

    e.hit = true;
    onHit(e);
    return;
  }
}

function onHit(e){
  if(e.kind === 'mon'){
    state = 'clash'; stateT = 0;
    clash = { e, win: P.num > e.num };
    SFX.clash();
  }
  else if(e.kind === 'later'){
    heroStopHits++;
    state = 'stun'; stateT = 0;
    stunLeft = 2.1;
    SFX.bad();
    float(P.x, P.y + PH + 3.2, '以 后 再 说。', '#ff5a5a', 1.5);
    shake(9); flash(0.32);
    e.dead = true;reportHeroProgress();
  }
  else if(e.kind === 'gold'){
    P.num += e.v;
    popNum();
    SFX.gold();
    float(e.x, e.y + 2.4, '+' + e.v, '#ffd54a', 1.5);
    burst(e.x, e.y, 20, '#ffd54a');
    shake(4);
    e.dead = true;
    syncHUD();
  }
  else if(e.kind === 'chest'){
    state = 'chest'; stateT = 0;
    chestSeq = { t: 0, stage: 0 };
    SFX.chest();
    shake(6);
    float(0, 92 + 3.4, '勇 气 之 剑', '#ffd54a', 1.6);
  }
}

/* ══════════════════════════════════════════════════════
   结算：金属碰撞
   ══════════════════════════════════════════════════════ */
function resolveClash(){
  const e = clash.e;

  if(clash.win){
    P.num += e.num;
    P.popT = 0.4;
    popNum();
    SFX.win();
    burst(e.x, e.y, 26, '#ffd54a');
    float(e.x, e.y + 2.6, '+' + e.num, '#ffd54a', 1.6);
    shake(7);
    e.dead = true;

    /* 同排的所有同类一并散开 —— "到处都是它，它散了。" */
    for(const o of ents){
      if(o.dead || o === e) continue;
      if(o.kind === 'mon' && Math.abs(o.y - e.y) < 1.5){
        o.dead = true;
        burst(o.x, o.y, 10, '#6a7a5a');
      }
    }
    syncHUD();
  }else{
    SFX.fail();
    shake(14); flash(0.5);
    e.hit = false;
    P.y = Math.max(0, P.y - 10);
    float(P.x, P.y + PH + 2.6, '数字不够', '#ff6b6b', 1.3);
  }

  clash = null;
  state = 'run';
}

/* ══════════════════════════════════════════════════════
   BOSS
   ══════════════════════════════════════════════════════ */
function onBoss(){
  state = 'boss';
  stateT = 0;
  bossSeq = { t: 0, stage: 0 };
  if(run === 'NG'){
    SFX.fail();
    shake(18); flash(0.6);
  }else{
    SFX.win2();
    shake(12); flash(0.5);
  }
}

function updateBoss(dt){
  bossSeq.t += dt;
  const t = bossSeq.t;

  if(run === 'NG'){
    if(bossSeq.stage === 0 && t > 1.4){ bossSeq.stage = 1; shake(10); }
    if(bossSeq.stage === 1 && t > 2.6){ bossSeq.stage = 2; fadeAmt = Math.min(1,(t-2.6)/1.1); }
    if(bossSeq.stage === 2 && t > 4.0){ endNG(); }
  }else{
    if(bossSeq.stage === 0 && t > 1.5){ bossSeq.stage = 1; shake(14); flash(0.4); }
    if(bossSeq.stage === 1 && t > 3.4){ bossSeq.stage = 2; fadeAmt = Math.min(1,(t-3.4)/1.4); }
    if(bossSeq.stage === 2 && t > 5.2){ endNGP(); }
  }
}

/* ══════════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════════ */
let lastT = performance.now();

function loop(now){
  heroFrame=requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if(manualPaused||hostPaused){render();return;}
  T += dt;
  hostSaveClock+=dt;if(hostSaveClock>=1){hostSaveClock=0;if(state==='run')reportHeroProgress();}

  if(state === 'run'){
    updatePlayer(dt);
    checkHit();
    syncTrack();
  }
  else if(state === 'clash'){
    stateT += dt;
    if(stateT > 0.52) resolveClash();
  }
  else if(state === 'stun'){
    stateT += dt;
    stunLeft -= dt;
    P.y = Math.max(0, P.y - 5 * dt);
    if(stateT > 1.9) state = 'run';
  }
  else if(state === 'chest'){
    stateT += dt;
    if(stateT > 2.2){
      if(!chestOpened){
        chestOpened = true;
        P.num += R.chestBonus;
        P.sword = true;
        popNum(); syncHUD();
        burst(0, P.y + 3, 46, '#ffd54a');
        float(0, P.y + 6, '+' + R.chestBonus, '#ffd54a', 2.0);
        shake(10);
      }
      if(stateT > 3.0) state = 'run';
    }
  }
  else if(state === 'boss'){
    updateBoss(dt);
  }

  /* 相机 */
  camY += (P.y - camY) * Math.min(1, dt * 13);

  /* 特效 */
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.vy -= 24 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.life -= dt;
    if(f.life <= 0){ floats.splice(i,1); continue; }
    f.y += 9 * dt;
  }
  if(shakeAmt > 0) shakeAmt = Math.max(0, shakeAmt - dt * 34);
  if(flashAmt > 0) flashAmt = Math.max(0, flashAmt - dt * 1.9);

  render();
}
requestAnimationFrame(loop);

/* ══════════════════════════════════════════════════════
   绘制：世界
   ══════════════════════════════════════════════════════ */
function skyColors(){
  const t = Math.max(0, Math.min(1, P.y / BOSS_Y));
  return { top: R.skyTop, bot: R.skyBot, t };
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, R.skyTop);
  g.addColorStop(1, R.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 高处的星 */
  const t = Math.max(0, Math.min(1, P.y / BOSS_Y));
  if(t > 0.18){
    const a = (t - 0.18) / 0.82;
    ctx.fillStyle = 'rgba(200,225,255,' + (a*0.55).toFixed(3) + ')';
    for(let i=0;i<70;i++){
      const sx0 = (i * 137.5) % W;
      const sy0 = (i * 71.3) % (H * 0.72);
      const drift = (camY * 0.05) % 40;
      const r = (i % 3 === 0) ? 1.4 : 0.9;
      ctx.fillRect(sx0, sy0 - drift, r, r);
    }
  }
}

function drawRidge(offsetY, amp, freq, color, phase, base){
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  for(let x=-10; x<=W+10; x+=10){
    const y = H * base + offsetY
            + Math.sin(x * freq + phase) * amp
            + Math.sin(x * freq * 2.7 + phase * 1.6) * amp * 0.42;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, H + 10);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawBackground(){
  /* 远景 */
  drawRidge(camY * 0.045, 42, 0.0042, 'rgba(28,44,62,.55)', 0.4, 0.44);
  /* 中景 */
  drawRidge(camY * 0.095, 34, 0.0071, 'rgba(18,28,40,.78)', 2.1, 0.56);
  /* 近景影 */
  drawRidge(camY * 0.16, 26, 0.0105, 'rgba(9,14,20,.9)', 4.4, 0.68);

  /* 雾带 */
  const fy = ((camY * 0.4) % (H * 1.4)) - H * 0.2;
  const g = ctx.createLinearGradient(0, fy - 90, 0, fy + 90);
  g.addColorStop(0, 'rgba(120,150,180,0)');
  g.addColorStop(0.5, 'rgba(120,150,180,.055)');
  g.addColorStop(1, 'rgba(120,150,180,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, fy - 90, W, 180);
}

function drawTrail(){
  const cx = W / 2;
  const hw = TRAIL_HW * SCALE;

  /* 两侧岩壁 */
  ctx.fillStyle = R.rockA;
  ctx.fillRect(0, 0, cx - hw, H);
  ctx.fillRect(cx + hw, 0, W - (cx + hw), H);

  /* 岩壁碎石 */
  for(const r0 of rocks){
    const y = sy(r0.y);
    if(y < -40 || y > H + 40) continue;
    const x = cx + r0.side * (hw + r0.off * SCALE);
    ctx.fillStyle = r0.side < 0 ? R.rockB : R.rockA;
    ctx.globalAlpha = r0.a;
    ctx.fillRect(x - (r0.side<0?r0.w*SCALE:0), y, r0.w * SCALE, r0.h * SCALE);
    ctx.globalAlpha = 1;
  }

  /* 岩壁边缘阴影 */
  let g = ctx.createLinearGradient(cx - hw - 40, 0, cx - hw, 0);
  g.addColorStop(0, 'rgba(0,0,0,.55)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - hw - 40, 0, 40, H);

  g = ctx.createLinearGradient(cx + hw + 40, 0, cx + hw, 0);
  g.addColorStop(0, 'rgba(0,0,0,.55)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx + hw, 0, 40, H);

  /* 山道面 */
  g = ctx.createLinearGradient(cx - hw, 0, cx + hw, 0);
  g.addColorStop(0,    R.trailA);
  g.addColorStop(0.42, R.trailB);
  g.addColorStop(0.58, R.trailB);
  g.addColorStop(1,    R.trailA);
  ctx.fillStyle = g;
  ctx.fillRect(cx - hw, 0, hw * 2, H);

  /* 台阶纹 */
  const STEP = 1.8;
  const yStart = Math.floor((camY - 24) / STEP) * STEP;
  const yEnd   = camY + H / SCALE + 4;
  ctx.strokeStyle = 'rgba(180,210,190,.075)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let y = yStart; y < yEnd; y += STEP){
    const s = sy(y);
    if(s < -6 || s > H + 6) continue;
    ctx.moveTo(cx - hw, Math.round(s) + .5);
    ctx.lineTo(cx + hw, Math.round(s) + .5);
  }
  ctx.stroke();

  /* 发光边缘 */
  ctx.fillStyle = R.edge;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(cx - hw, 0, 2, H);
  ctx.fillRect(cx + hw - 2, 0, 2, H);
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════
   绘制：数字
   ══════════════════════════════════════════════════════ */
function drawNum(x, y, n, color, size){
  ctx.save();
  ctx.font = 'bold ' + size + 'px "Courier New",monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 0.75;
  ctx.fillStyle = color;
  ctx.fillText(String(n), x, y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(n), x, y);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ══════════════════════════════════════════════════════
   绘制：玩家
   ══════════════════════════════════════════════════════ */
function blk(x, yTop, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(x * SCALE, -(yTop + h) * SCALE, w * SCALE, h * SCALE);
}

function drawPlayer(){
  const px = sx(P.x);
  const py = sy(P.y);
  const U  = SCALE;
  const bob = state === 'run' ? Math.abs(Math.sin(T * 9.5)) * 0.13 : 0;
  const legA = Math.sin(T * 9.5) * 0.45;
  const pressed = (state === 'stun');

  ctx.save();
  ctx.translate(px, py);

  /* 影子 */
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(0, 1, PW * U * 0.6, 3.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(0, -bob * U);

  const legClr  = '#33446b';
  const bootClr = '#3a2a1e';
  const bodyClr = P.sword ? '#3f8a5b' : '#3f8a5b';
  const beltClr = P.sword ? '#c9a24a' : '#8a6a3a';

  if(pressed){
    ctx.globalAlpha = 0.75;
  }

  /* 腿 */
  blk(-0.78 + legA * 0.16, 0.32, 0.6, 1.25, legClr);
  blk( 0.18 - legA * 0.16, 0.32, 0.6, 1.25, legClr);
  blk(-0.84 + legA * 0.16, 0,    0.72, 0.42, bootClr);
  blk( 0.12 - legA * 0.16, 0,    0.72, 0.42, bootClr);

  /* 躯干 */
  blk(-0.95, 1.5, 1.9, 2.0, bodyClr);
  blk(-1.0,  1.5, 2.0, 0.3, beltClr);

  /* 手臂 */
  blk(-1.30, 1.85, 0.45, 1.65, '#357a4e');
  blk( 0.85, 1.85, 0.45, 1.65, '#357a4e');

  /* 旧游戏机徽章 */
  blk(-0.42, 2.42, 0.84, 0.62, '#141a1e');
  blk(-0.28, 2.56, 0.42, 0.26, '#7fe39a');

  /* 头 */
  blk(-0.80, 3.50, 1.60, 1.12, '#f2c9a0');
  blk(-0.90, 4.32, 1.80, 0.50, '#2b2233');
  blk(-0.46, 3.94, 0.26, 0.30, '#1a1014');
  blk( 0.20, 3.94, 0.26, 0.30, '#1a1014');
  blk(-0.16, 3.70, 0.34, 0.14, '#c98a7a');

  /* 剑 */
  const bladeTop = 2.2;
  const bladeH   = 4.1;
  const bladeClr = P.sword ? '#ffd54a' : '#c8d0d8';
  ctx.save();
  if(P.sword){
    ctx.shadowColor = '#ffd54a';
    ctx.shadowBlur = 12 + Math.sin(T * 4) * 5;
  }
  blk(1.03, bladeTop, 0.3, bladeH, bladeClr);
  ctx.restore();
  blk(0.85, 2.10, 0.78, 0.26, P.sword ? '#d9b25a' : '#8a6a3a');
  blk(1.01, 1.60, 0.36, 0.55, P.sword ? '#6a4a1e' : '#5a3a1e');

  ctx.globalAlpha = 1;
  ctx.restore();

  /* 头顶数字 */
  const numY = py - (PH + bob) * U - 34;
  const size = 34 + (P.popT > 0 ? P.popT * 26 : 0);
  drawNum(px, numY, Math.round(P.num), P.sword ? '#ffe27a' : '#ffd54a', size);
}

/* ══════════════════════════════════════════════════════
   绘制：怪物
   ══════════════════════════════════════════════════════ */
function drawShade(g, u, t){
  /* 墨团 */
  ctx.fillStyle = '#0b0e18';
  const pts = [
    [0, -2.3, 2.5, 2.2],
    [-1.1, -1.6, 1.7, 1.5],
    [1.2, -1.7, 1.6, 1.4],
    [0, -3.6, 1.6, 1.3],
    [-0.6, -0.8, 1.3, 1.0],
    [0.7, -0.9, 1.2, 0.9]
  ];
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    const w = 1 + Math.sin(t * 2.3 + i) * 0.055;
    ctx.beginPath();
    ctx.ellipse(p[0]*u, p[1]*u, p[2]*u*w, p[3]*u*(2-w), 0, 0, Math.PI*2);
    ctx.fill();
  }
  /* 眼 */
  const blink = (t % 3.4) > 3.24 ? 0.12 : 1;
  ctx.fillStyle = '#eef4ff';
  ctx.fillRect(-0.92*u, -2.7*u, 0.42*u, 0.62*u*blink);
  ctx.fillRect( 0.50*u, -2.7*u, 0.42*u, 0.62*u*blink);
}

function drawVoid(g, u, t){
  const p = 1 + Math.sin(t * 2.0) * 0.1;
  /* 内部的黑 */
  ctx.fillStyle = '#010302';
  ctx.fillRect(-1.6*u*p, -4.4*u, 3.2*u*p, 4.0*u);
  /* 门框 */
  ctx.fillStyle = '#3e6a52';
  ctx.fillRect(-2.2*u, -4.6*u, 0.42*u, 4.4*u);
  ctx.fillRect( 1.78*u, -4.6*u, 0.42*u, 4.4*u);
  ctx.fillRect(-2.2*u, -4.6*u, 4.4*u, 0.42*u);
  ctx.fillRect(-2.2*u, -0.42*u, 4.4*u, 0.42*u);
  ctx.fillStyle = '#5a9a76';
  ctx.fillRect(-2.2*u, -4.6*u, 0.42*u, 0.42*u);
  ctx.fillRect( 1.78*u, -0.42*u, 0.42*u, 0.42*u);
}

function drawEcho(g, u, t){
  /* 两张对冲的锯齿嘴 */
  const j = Math.sin(t * 26) * 0.14;
  ctx.fillStyle = '#8a3030';
  ctx.beginPath();
  ctx.moveTo((-2.6 + j)*u, -4.4*u);
  ctx.lineTo((-0.4 + j)*u, -2.4*u);
  ctx.lineTo((-2.6 + j)*u, -0.4*u);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(( 2.6 - j)*u, -4.4*u);
  ctx.lineTo(( 0.4 - j)*u, -2.4*u);
  ctx.lineTo(( 2.6 - j)*u, -0.4*u);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#c04a4a';
  ctx.beginPath();
  ctx.moveTo((-2.0 + j)*u, -3.7*u);
  ctx.lineTo((-0.9 + j)*u, -2.4*u);
  ctx.lineTo((-2.0 + j)*u, -1.1*u);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(( 2.0 - j)*u, -3.7*u);
  ctx.lineTo(( 0.9 - j)*u, -2.4*u);
  ctx.lineTo(( 2.0 - j)*u, -1.1*u);
  ctx.closePath(); ctx.fill();

  /* 声波环 */
  for(let i=0;i<3;i++){
    const k = ((t * 0.85 + i/3) % 1);
    ctx.strokeStyle = 'rgba(255,176,176,' + ((1-k)*0.85).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -2.4*u, (0.5 + k*3.2) * u, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawDoor(g, u, t){
  const wob = Math.sin(t * 0.8) * 0.03;
  ctx.save();
  ctx.rotate(wob * 0.06);
  /* 门体 */
  ctx.fillStyle = '#5a3f28';
  ctx.fillRect(-1.8*u, -5.0*u, 3.6*u, 5.0*u);
  ctx.fillStyle = '#6f4e32';
  ctx.fillRect(-1.8*u, -5.0*u, 3.6*u, 0.35*u);
  ctx.fillStyle = '#3f2c1b';
  ctx.fillRect(-1.8*u, -2.6*u, 3.6*u, 0.35*u);
  ctx.fillRect(-0.18*u, -5.0*u, 0.36*u, 5.0*u);
  /* 锁孔 */
  const glow = 0.45 + Math.abs(Math.sin(t * 1.5)) * 0.5;
  ctx.fillStyle = 'rgba(255,213,74,' + glow.toFixed(3) + ')';
  ctx.beginPath();
  ctx.arc(0.75*u, -2.5*u, 0.28*u, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(0.65*u, -2.5*u, 0.2*u, 0.7*u);
  /* 门框 */
  ctx.fillStyle = '#241a11';
  ctx.fillRect(-2.15*u, -5.4*u, 0.36*u, 5.6*u);
  ctx.fillRect( 1.79*u, -5.4*u, 0.36*u, 5.6*u);
  ctx.fillRect(-2.15*u, -5.4*u, 4.3*u, 0.36*u);
  ctx.fillRect(-2.15*u, -0.16*u, 4.3*u, 0.36*u);
  ctx.restore();
}

function drawKnot(g, u, t){
  const p = 1 + Math.sin(t * 1.9) * 0.09;
  /* 缠线 */
  ctx.strokeStyle = '#6c3f68';
  ctx.lineWidth = 3;
  for(let i=0;i<3;i++){
    const ph = t * 1.4 + i * 2.1;
    ctx.beginPath();
    const r = 2.1 * u * p;
    for(let a=0; a<=Math.PI*2 + 0.1; a+=0.24){
      const rr = r * (0.72 + Math.sin(a*3 + ph) * 0.3);
      const x = Math.cos(a) * rr;
      const y = -2.4*u + Math.sin(a) * rr;
      if(a === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  /* 结 */
  ctx.fillStyle = '#b06aa8';
  ctx.beginPath();
  ctx.arc(0, -2.4*u, 0.72*u*p, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e8b8e0';
  ctx.beginPath();
  ctx.arc(0, -2.4*u, 0.3*u, 0, Math.PI*2);
  ctx.fill();
}

const MON_DRAW = {
  shade: drawShade, void: drawVoid, echo: drawEcho,
  door: drawDoor,   knot: drawKnot
};
const MON_NAME = {
  shade:'黑 影', void:'空 房 间', echo:'争吵的回声',
  door:'关 上 的 门', knot:'说不出口'
};

function drawMonster(e){
  const px = sx(e.x);
  const py = sy(e.y + e.h/2);
  const U = SCALE;
  const bob = Math.sin(T * 1.4 + e.t) * 0.18;

  ctx.save();
  ctx.translate(px, py + bob * U);

  /* 影子 */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(0, 0, e.w * U * 0.42, 4, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = e.hit && state === 'clash' ? 0.9 : 1;
  (MON_DRAW[e.id] || drawShade)(e, U, T + e.t);
  ctx.restore();

  ctx.restore();

  /* 头顶数字 */
  const numY = sy(e.y + e.h/2) - (e.h + 1.3) * U;
  drawNum(px, numY, e.num, '#ff8a8a', 32);
}

function drawGoldGate(e){
  const px = sx(e.x);
  const py = sy(e.y);
  const U = SCALE;
  const pulse = 0.55 + Math.abs(Math.sin(T * 2.2 + e.t)) * 0.45;

  ctx.save();
  ctx.translate(px, py);

  const hw = e.w/2 * U, hh = e.h/2 * U;

  /* 光晕 */
  ctx.fillStyle = 'rgba(255,213,74,' + (0.06 + pulse*0.09).toFixed(3) + ')';
  ctx.fillRect(-hw - 10, -hh - 10, hw*2 + 20, hh*2 + 20);

  /* 面板 */
  ctx.fillStyle = 'rgba(255,213,74,' + (0.10 + pulse*0.14).toFixed(3) + ')';
  ctx.fillRect(-hw, -hh, hw*2, hh*2);

  /* 边框 */
  ctx.strokeStyle = '#ffd54a';
  ctx.lineWidth = 3;
  ctx.strokeRect(-hw, -hh, hw*2, hh*2);

  /* 两侧柱 */
  ctx.fillStyle = '#c9a24a';
  ctx.fillRect(-hw - 4, -hh - 6, 6, hh*2 + 12);
  ctx.fillRect( hw - 2, -hh - 6, 6, hh*2 + 12);

  ctx.restore();

  drawNum(px, py, '+' + e.v, '#ffd54a', 28);
}

function drawLaterGate(e){
  const px = sx(e.x);
  const py = sy(e.y);
  const U = SCALE;
  const pulse = 0.5 + Math.abs(Math.sin(T * 3.4 + e.t)) * 0.5;

  ctx.save();
  ctx.translate(px, py);

  const hw = e.w/2 * U, hh = e.h/2 * U;

  ctx.fillStyle = 'rgba(255,60,60,' + (0.08 + pulse*0.12).toFixed(3) + ')';
  ctx.fillRect(-hw, -hh, hw*2, hh*2);

  ctx.strokeStyle = '#ff4a4a';
  ctx.lineWidth = 3;
  ctx.strokeRect(-hw, -hh, hw*2, hh*2);

  ctx.fillStyle = '#a02020';
  ctx.fillRect(-hw - 4, -hh - 6, 6, hh*2 + 12);
  ctx.fillRect( hw - 2, -hh - 6, 6, hh*2 + 12);

  ctx.restore();

  ctx.save();
  ctx.font = 'bold 20px "Courier New",monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff4a4a';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ff9a9a';
  ctx.fillText('以后再说', px, py);
  ctx.restore();
}

function drawChest(e){
  const px = sx(e.x);
  const py = sy(e.y + e.h/2);
  const U = SCALE;
  const open = chestOpened || state === 'chest';
  const k = state === 'chest' ? Math.min(1, stateT / 0.9) : (open ? 1 : 0);

  const pulse = 0.5 + Math.abs(Math.sin(T * 1.8)) * 0.5;

  ctx.save();
  ctx.translate(px, py);

  /* 光柱 */
  if(k > 0){
    const g = ctx.createLinearGradient(0, -14*U, 0, 0);
    g.addColorStop(0, 'rgba(255,213,74,0)');
    g.addColorStop(1, 'rgba(255,213,74,' + (0.3*k).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(-1.4*U, -14*U, 2.8*U, 14*U);
  }

  /* 影子 */
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 2.6*U, 4, 0, 0, Math.PI*2);
  ctx.fill();

  /* 箱体 */
  ctx.fillStyle = '#5a3a20';
  ctx.fillRect(-2.4*U, -2.4*U, 4.8*U, 2.4*U);
  ctx.fillStyle = '#c9a24a';
  ctx.fillRect(-2.55*U, -2.4*U, 0.4*U, 2.4*U);
  ctx.fillRect( 2.15*U, -2.4*U, 0.4*U, 2.4*U);

  /* 盖子 */
  ctx.save();
  ctx.translate(0, -2.4*U);
  ctx.rotate(-k * 1.5);
  ctx.fillStyle = '#6a4526';
  ctx.fillRect(-2.45*U, -0.9*U, 4.9*U, 0.9*U);
  ctx.fillStyle = '#c9a24a';
  ctx.fillRect(-2.55*U, -0.9*U, 0.4*U, 0.9*U);
  ctx.fillRect( 2.15*U, -0.9*U, 0.4*U, 0.9*U);
  ctx.restore();

  /* 锁 */
  if(k < 0.3){
    ctx.fillStyle = 'rgba(255,213,74,' + pulse.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(0, -1.5*U, 0.36*U, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  if(!open){
    ctx.save();
    ctx.font = 'bold 22px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd54a';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd54a';
    ctx.fillText('宝 箱', px, py - 4.2*U);
    ctx.restore();
  }
}

function drawBoss(e){
  const px = sx(0);
  const py = sy(e.y + e.h/2);
  const U = SCALE;

  let lean = 0, sep = 0, light = 0;
  if(state === 'boss'){
    const t = bossSeq.t;
    if(run === 'NGP'){
      const k = Math.max(0, Math.min(1, (t - 1.5) / 1.9));
      sep = k * 7;
      lean = -k * 0.75;
      light = k;
    }else{
      lean = Math.sin(t * 5) * 0.06;
    }
  }else{
    lean = Math.sin(T * 0.9) * 0.05;
  }

  ctx.save();
  ctx.translate(px, py);

  /* 血雾 */
  ctx.fillStyle = 'rgba(90,20,20,.34)';
  ctx.beginPath();
  ctx.ellipse(0, -6*U, 9*U, 7*U, 0, 0, Math.PI*2);
  ctx.fill();

  /* 两个剪影 */
  const drawAdult = (dir, offX, rot) => {
    ctx.save();
    ctx.translate(offX * U, 0);
    ctx.rotate(rot);
    ctx.fillStyle = '#08080b';
    /* 头 */
    ctx.beginPath();
    ctx.arc(0, -12.4*U, 1.45*U, 0, Math.PI*2);
    ctx.fill();
    /* 身 */
    ctx.beginPath();
    ctx.moveTo(-1.7*U, 0);
    ctx.lineTo(-1.0*U, -11.2*U);
    ctx.lineTo( 1.0*U, -11.2*U);
    ctx.lineTo( 1.7*U, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };

  drawAdult(-1, -3.4 - sep, -0.2 + lean);
  drawAdult( 1,  3.4 + sep,  0.2 - lean);

  /* 门 */
  ctx.fillStyle = '#141014';
  ctx.fillRect(-1.5*U, -5.6*U, 3.0*U, 5.6*U);

  /* 门缝里的光 */
  const lg = 0.55 + Math.abs(Math.sin(T * 1.4)) * 0.4;
  ctx.save();
  ctx.shadowColor = '#ffd54a';
  ctx.shadowBlur = 18 + light * 40;
  ctx.fillStyle = 'rgba(255,213,74,' + Math.min(1, lg + light).toFixed(3) + ')';
  ctx.fillRect(-0.22*U - light*0.6*U, -5.2*U, 0.44*U + light*1.2*U, 5.2*U);
  ctx.restore();

  /* 扩散的光 */
  if(light > 0){
    const g = ctx.createRadialGradient(0, -3*U, 0, 0, -3*U, 16*U);
    g.addColorStop(0, 'rgba(255,213,74,' + (light*0.5).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,213,74,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-18*U, -20*U, 36*U, 24*U);
  }

  ctx.restore();

  /* BOSS 数字 */
  const numY = py - (e.h + 3.5) * U;
  drawNum(px, numY, R.bossNum, '#ff6b6b', 54);
}

/* ══════════════════════════════════════════════════════
   绘制：对比弹窗
   ══════════════════════════════════════════════════════ */
function drawClash(){
  if(!clash) return;
  const e = clash.e;
  const a = Math.min(1, stateT / 0.1) * Math.min(1, (0.52 - stateT) / 0.12);
  if(a <= 0) return;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(2,4,9,.62)';
  ctx.fillRect(0, 0, W, H);

  const cy = H * 0.42;
  const gap = Math.min(150, W * 0.16);

  ctx.font = 'bold 13px "Courier New",monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5f8a70';
  ctx.fillText('你', W/2 - gap, cy - 46);
  ctx.fillText(MON_NAME[e.id] || '它', W/2 + gap, cy - 46);

  drawNum(W/2 - gap, cy, Math.round(P.num),
    clash.win ? '#ffd54a' : '#8a7a4a', 62);
  drawNum(W/2 + gap, cy, e.num,
    clash.win ? '#8a5a5a' : '#ff6b6b', 62);

  ctx.font = 'bold 22px "Courier New",monospace';
  ctx.fillStyle = '#3d6250';
  ctx.fillText('VS', W/2, cy + 4);

  ctx.font = 'bold 15px "Courier New",monospace';
  ctx.fillStyle = clash.win ? '#7fe39a' : '#ff6b6b';
  ctx.fillText(clash.win ? '你 比 它 大' : '它 比 你 大', W/2, cy + 58);

  ctx.restore();
}

/* ══════════════════════════════════════════════════════
   绘制：BOSS 文字序列
   ══════════════════════════════════════════════════════ */
function drawBossText(){
  if(state !== 'boss' || !bossSeq) return;
  const t = bossSeq.t;

  const lines = run === 'NG'
    ? [
        { at:0.35, txt:'你　' + Math.round(P.num), c:'#ffd54a', s:34 },
        { at:0.75, txt:'它　' + R.bossNum,       c:'#ff6b6b', s:34 },
        { at:1.5,  txt:'剑 断 了。',              c:'#ff6b6b', s:26 },
        { at:2.7,  txt:'',                        c:'#fff',    s:20 }
      ]
    : [
        { at:0.35, txt:'你　' + Math.round(P.num), c:'#ffd54a', s:34 },
        { at:0.75, txt:'它　' + R.bossNum,       c:'#ff6b6b', s:34 },
        { at:1.6,  txt:'——',                     c:'#fff',    s:26 },
        { at:2.2,  txt:'光。',                    c:'#7fe39a', s:30 },
        { at:3.0,  txt:'它 散 开 了。',            c:'#7fe39a', s:26 },
        { at:4.0,  txt:'天 亮 了。',              c:'#ffd54a', s:32 }
      ];

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let idx = 0;
  for(const L of lines){
    if(L.txt === '') continue;
    if(t < L.at) continue;
    const a = Math.min(1, (t - L.at) / 0.28);
    const y = H * 0.30 + idx * 46;
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + L.s + 'px "Courier New",monospace';
    ctx.shadowColor = L.c;
    ctx.shadowBlur = L.s * 0.8;
    ctx.fillStyle = L.c;
    ctx.fillText(L.txt, W/2, y);
    ctx.shadowBlur = 0;
    idx++;
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════
   绘制：特效
   ══════════════════════════════════════════════════════ */
function drawParts(){
  for(const p of parts){
    const k = p.life / p.max;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.c;
    const s = p.s * SCALE * (0.6 + k * 0.6);
    ctx.fillRect(sx(p.x) - s/2, sy(p.y) - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const f of floats){
    const k = f.life / f.max;
    ctx.globalAlpha = Math.min(1, k * 1.6);
    const size = 26 * f.size * (1 + (1-k) * 0.35);
    ctx.font = 'bold ' + size + 'px "Courier New",monospace';
    ctx.shadowColor = f.color;
    ctx.shadowBlur = size * 0.8;
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, sx(f.x), sy(f.y));
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════
   主渲染
   ══════════════════════════════════════════════════════ */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if(state === 'title') return;

  ctx.save();

  if(shakeAmt > 0.2){
    ctx.translate(
      (Math.random() - 0.5) * shakeAmt,
      (Math.random() - 0.5) * shakeAmt
    );
  }

  /* 世界 */
  drawSky();
  drawBackground();
  drawTrail();

  /* 实体 */
  const visible = [];
  for(const e of ents){
    if(e.dead) continue;
    const s = sy(e.y);
    if(s < -220 || s > H + 140) continue;
    visible.push(e);
  }

  /* 按 y 排序，高的后画 */
  visible.sort((a, b) => a.y - b.y);
  for(const e of visible){
    if(e.kind === 'mon')        drawMonster(e);
    else if(e.kind === 'gold')  drawGoldGate(e);
    else if(e.kind === 'later') drawLaterGate(e);
    else if(e.kind === 'chest') drawChest(e);
    else if(e.kind === 'boss')  drawBoss(e);
  }

  /* 玩家 */
  drawPlayer();

  /* 特效 */
  drawParts();
  drawFloats();

  ctx.restore();

  /* 对比弹窗 */
  drawClash();

  /* BOSS 文字 */
  drawBossText();

  /* 闪光 */
  if(flashAmt > 0.01){
    ctx.fillStyle = 'rgba(255,80,80,' + (flashAmt * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  /* 暗角 */
  const vg = ctx.createRadialGradient(
    W/2, H/2, Math.min(W,H) * 0.32,
    W/2, H/2, Math.max(W,H) * 0.78
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* 淡出 */
  if(fadeAmt > 0){
    ctx.fillStyle = 'rgba(0,0,0,' + fadeAmt.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  /* 眩晕提示 */
  if(state === 'stun'){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const a = Math.min(1, stateT / 0.2);
    ctx.globalAlpha = a * 0.9;
    ctx.font = 'bold 44px "Courier New",monospace';
    ctx.shadowColor = '#ff3a3a';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ff5a5a';
    ctx.fillText('以 后 再 说。', W/2, H * 0.36);
    ctx.restore();
  }
}
