<style>

/* The outer game shell scales once; iframe coordinates remain 1280 × 720. */
body.embedded #wrap{width:1280px;height:720px;overflow:hidden}

}

<body><div id="wrap"><canvas id="game" width="1280" height="720" aria-label="车站跑酷游戏"></canvas><div id="toast"></div><div id="topbuttons"><button id="pauseBtn">暂停 P</button><button id="soundBtn">声音：开</button></div><div id="touch"><div class="cluster"><button type="button" class="ctl small" id="itemTouch" data-action="item">护盾</button><button type="button" class="ctl small" id="medTouch" data-action="heal">体力</button><button type="button" class="ctl small" id="timeTouch" data-action="time">延时</button></div><div class="cluster"><button type="button" class="ctl small" data-action="upper">上道</button><button type="button" class="ctl small" data-action="lower">下道</button><button type="button" class="ctl small" data-action="slide">下蹲</button><button type="button" class="ctl small" data-action="jump">跳跃</button></div></div><div id="overlay"></div></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),c=cv.getContext('2d'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
document.body.classList.toggle('embedded',new URLSearchParams(location.search).has('embedded'));
const W=1280,H=720,FLOOR=566,PX=260,DISTANCE=14500,ITEM_HEIGHT=250,LANE_FLOORS=[380,635],DRAW_SCALE=.62;
let lane=1,fromLane=1,laneBlend=1,switchTime=0,switchCooldown=0,section=0,detours=0;let mode='menu',journey=1,last=0,elapsed=0,progress=0,clock=1166,health=3,timeLimit=44,timedOut=false,fallSlide=false,shortJump=false,jumpAge=0,collisions=0,stamina=100,route=0,cleanTime=0,penaltyFlash=0,speed=220,meds=0,clocks=0,result=null,host=null,items=0,shield=false,used=0,spawnIndex=0,world=0,y=0,vy=0,slide=0,slidePose=0,slideHeld=false,inv=0,spawn=1.8,obs=[],sound=true,ac,ending=0,trainX=0,toastTime=0;
let options={},hostPaused=false,disposed=false,delivered=false,initializing=false,frameId=0,saveElapsed=0,lastBeep=-Infinity;
const coarse=matchMedia('(pointer:coarse)').matches;
function feedback(name='select'){try{window.parent.playGameSfx?.(name);}catch{}}
function beep(f=500){const volume=Math.max(0,Math.min(1,Number(options.getSfxVolume?.()??.8)));const now=performance.now();if(!sound||volume===0||now-lastBeep<150)return;lastBeep=now;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.018*volume,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.13);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch{}}
function say(t){toast.textContent=t;toast.style.opacity=1;toastTime=1.8}
function syncControls(){
 document.getElementById('touch').hidden=mode!=='playing';
 document.getElementById('topbuttons').hidden=!['playing','paused'].includes(mode);
 document.getElementById('pauseBtn').textContent=mode==='paused'?'继续':'暂停';
}
function panel(title,msg,buttons,help=''){
 overlay.innerHTML=`<div class="panel"><div class="eyebrow">第三幕 · 第${journey===1?'一':'二'}周目</div><h1>${title}</h1><p>${msg}</p><div class="buttons">${buttons.map((a,i)=>`<button data-i="${i}" class="${i?'alt':''}">${a[0]}</button>`).join('')}</div>${help?`<details><summary>操作与路线说明</summary>${help}</details>`:''}<p class="help">${coarse?'点按按钮操作':'空格确认 · P 暂停'}</p></div>`;
 overlay.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{feedback(+b.dataset.i?'select':'confirm');buttons[+b.dataset.i][1]();});syncControls();
}
function menu(){mode='menu';journey=1;panel('最后一班车','19:30，A 将离开。<br>穿过黄昏的候车大厅，奔向你没来得及说出口的话。',[['开始旅程',()=>start(1)]]);}
function continueStory(){
 if(mode!=='ended'||!result||delivered)return;
 if(host){delivered=true;report();mode='story';overlay.innerHTML='';syncControls();host({...result});return;}
 mode='story';if(journey===1)panel('那句没说出口的话','列车离开后，你仍然记得那一天。<br>如果时间再给你一次机会……',[['再次出发',()=>start(2)]]);
 else panel('这一段旅程结束了',result.won?'你终于把话说了出来。':'这一次，你仍没赶上。',result.won?[['返回标题',menu]]:[['再次尝试',()=>start(2)],['返回标题',menu]]);
}
function instructions(){return `${coarse?'上道 / 下道换道，轻点跳跃是短跳，按住是长跳。<br>下蹲也可以在空中快速落地。':'A / ← 上道，D / → 下道。<br>轻点空格 / ↑ 短跳，按住长跳；↓ / S 下蹲 / 快落。'}<br>整道货堆需要换道；地面障碍跳过，悬挂障碍下蹲。<br>紫色捷径障碍更多，绿色绕行更安全但会增加路程。<br>碰撞扣回 4.5% 路程并消耗体力，安全奔跑会恢复。${journey===2?'<br>跳起拾取道具：护盾抵挡一次碰撞，体力恢复 35，延时增加 5 秒。'+(coarse?'':'<br>E 护盾 · R 体力 · Q 延时'):''}`;}
function ready(){mode='ready';panel('最后一班车',journey===1?'那天，你站在拥挤的车站。<br>试着穿过人群，看看能走到哪里。':'这一次，你提前出发。<br>利用两条路线和途中道具，争取赶上列车。',[['奔向站台',begin]],instructions());}
function begin(){mode='playing';overlay.innerHTML='';syncControls();last=performance.now();report();}
function start(n){journey=n;mode='playing';elapsed=progress=world=y=vy=slide=slidePose=inv=items=used=spawnIndex=ending=trainX=0;slideHeld=false;lane=fromLane=1;laneBlend=1;switchTime=switchCooldown=section=detours=0;shield=false;timedOut=fallSlide=shortJump=false;jumpAge=collisions=0;timeLimit=n===1?44:56;stamina=100;route=cleanTime=penaltyFlash=0;meds=clocks=0;speed=220;result=null;clock=n===1?1166:1155;health=3;spawn=380;obs=[];delivered=false;saveElapsed=0;for(const id of ['itemTouch','medTouch','timeTouch'])document.getElementById(id).style.display=n===2?'grid':'none';overlay.innerHTML='';ready();report();}
function showResult(){panel(result.won?'你来了。':journey===1?'站台只剩下空位。':'还是差了一点。',
 (result.won?'A 在车门前转过身。<br>这一次，你赶在离别之前到达。':journey===1?'广播里传来列车离站的消息。<br>你还差一点，那句话却已经来不及说。':'离站时间到了，你还没赶到站台。<br>可以重试，也可以带着这次的结果继续。')+`<br>路程 ${Math.round(progress)}%${journey===2?' · 使用道具 '+used+' 次':''}`,
 journey===2&&!result.won?[['再试一次',()=>start(2)],['继续剧情',continueStory]]:[['继续剧情',continueStory]]);}
function finish(requestedWin){const won=journey===2&&requestedWin&&!timedOut;mode='ended';result={journey,won,outcome:won?'met':'missed',progress:Math.round(progress),health,reason:won?'arrived':timedOut?'timeout':'departure',elapsed:+elapsed.toFixed(2),collisions,detours,stamina:Math.round(stamina),itemsUsed:used};if(journey===2&&!won)options.onAchievement?.('station-missed-again');showResult();report();}
function arrive(timeout=false){if(mode!=='playing')return;mode='cinematic';timedOut=timeout;ending=0;obs=[];slide=0;y=vy=0;syncControls();say(timedOut?'广播：列车已经离站。':journey===1?'“请退后，车门即将关闭。”':'你终于看到了 A。');report();}
function resume(){mode='playing';overlay.innerHTML='';syncControls();last=performance.now();}
function pause(){if(hostPaused)return;if(mode==='playing'){mode='paused';slideHeld=false;shortJump=true;panel('暂停','调整好节奏再出发，暂停时倒计时不会流逝。',[['继续',resume],host?['重新挑战',()=>start(journey)]:['返回标题',menu]]);report();}else if(mode==='paused')resume();}
function getSaveData(){return {kind:'station-runner-v1',journey,mode:mode==='paused'?'playing':mode,lane,fromLane,laneBlend,switchTime,switchCooldown,section,detours,elapsed,progress,clock,health,timeLimit,timedOut,fallSlide,shortJump,jumpAge,collisions,stamina,route,cleanTime,penaltyFlash,speed,meds,clocks,items,shield,used,spawnIndex,world,y,vy,slide,slidePose,inv,spawn,ending,trainX,obs:obs.map(o=>({...o})),result:result?{...result}:null};}
function report(){if(!initializing&&!disposed&&host&&options.onProgress)options.onProgress(getSaveData());saveElapsed=0;}
function restore(value){
 if(value?.kind!=='station-runner-v1'||value.journey!==journey||!['ready','playing','cinematic','ended'].includes(value.mode))return false;
 const numbers=['lane','fromLane','laneBlend','switchTime','switchCooldown','section','detours','elapsed','progress','clock','health','timeLimit','jumpAge','collisions','stamina','route','cleanTime','penaltyFlash','speed','meds','clocks','items','used','spawnIndex','world','y','vy','slide','inv','spawn','ending','trainX'];
 if(numbers.some(key=>!Number.isFinite(value[key]))||![0,1].includes(value.lane)||![0,1].includes(value.fromLane)||value.timeLimit<=0||value.elapsed<0||value.elapsed>value.timeLimit||value.route<0||value.route>DISTANCE||value.stamina<0||value.stamina>100)return false;
 if(['timedOut','fallSlide','shortJump','shield'].some(key=>typeof value[key]!=='boolean')||['items','meds','clocks'].some(key=>!Number.isInteger(value[key])||value[key]<0||value[key]>3))return false;
 if(!Array.isArray(value.obs)||value.obs.length>256||value.obs.some(o=>!o||!['block','detour','crate','cone','bag','pipe','shutter','item','heal','time'].includes(o.type)||!Number.isFinite(o.x)||![0,1].includes(o.lane)||['height','width'].some(key=>o[key]!==undefined&&(!Number.isFinite(o[key])||o[key]<=0||o[key]>1000))))return false;
 if(value.mode==='ended'&&(!value.result||value.result.journey!==journey||value.result.won!==(value.result.outcome==='met')||!['met','missed'].includes(value.result.outcome)||journey===1&&value.result.won))return false;
 ({lane,fromLane,laneBlend,switchTime,switchCooldown,section,detours,elapsed,progress,clock,health,timeLimit,timedOut,fallSlide,shortJump,jumpAge,collisions,stamina,route,cleanTime,penaltyFlash,speed,meds,clocks,items,shield,used,spawnIndex,world,y,vy,slide,inv,spawn,ending,trainX}=value);
 obs=value.obs.map(o=>({...o}));slidePose=Number.isFinite(value.slidePose)?Math.max(0,Math.min(1,value.slidePose)):(slide>0?1:0);slideHeld=false;result=value.result?{...value.result}:null;mode=value.mode;progress=route/DISTANCE*100;shortJump=true;
 if(mode==='ended')showResult();else if(mode==='ready')ready();else if(mode==='playing'){mode='paused';panel('接着上次的脚步',`已走过 ${Math.round(progress)}% · 还剩 ${(timeLimit-elapsed).toFixed(1)} 秒`,[['继续奔跑',resume],['重新挑战',()=>start(journey)]]);}else{overlay.innerHTML='';syncControls();}
 return true;
}
window.stationRunner={
 start(config={}){if(![1,2].includes(config.journey))throw Error('journey must be 1 or 2');options=config;host=typeof config.onComplete==='function'?config.onComplete:null;initializing=true;start(config.journey);if(config.save)restore(config.save);initializing=false;report();},
 pause,getSaveData,handleKey,setHostPaused(value){hostPaused=!!value;if(hostPaused){slideHeld=false;shortJump=true;report();}},
 inspect(){return {...getSaveData(),mode,hostPaused};},
 dispose(){if(disposed)return;report();disposed=true;cancelAnimationFrame(frameId);try{ac?.close();}catch{}}
};
function control(action){if(mode!=='playing'||hostPaused||disposed)return;if(action==='upper'||action==='lower'||action==='swap'){const next=action==='swap'?1-lane:action==='upper'?0:1;if(next===lane)return;if(switchCooldown>0||switchTime>0)return;if(y>0||slide>0){say('落地站稳后再换道');return;}fromLane=lane;lane=next;switchTime=.3;switchCooldown=.65;beep(400);return;}if(action==='heal'){if(journey!==2||meds===0){say('还没有体力道具');return;}if(stamina>=100){say('体力已满');return;}meds--;stamina=Math.min(100,stamina+35);health=Math.ceil(stamina/34);used++;say('体力恢复 35');beep(700);return;}if(action==='time'){if(journey!==2||clocks===0){say('还没有延时道具');return;}clocks--;timeLimit+=5;used++;say('离站倒计时 +5 秒');beep(600);return;}if(action==='item'){if(journey!==2)return;if(shield){say('护盾已生效，碰撞后消耗');return;}if(items===0){say('先跳起拾取蓝色护盾');return;}items--;used++;shield=true;beep(800);say('护盾开启 · 抵挡一次碰撞');return;}if(action==='jump'&&y===0&&slide<=0){vy=jumpPower();jumpAge=0;shortJump=false;beep(620);}if(action==='slide'){if(y>0){vy=Math.min(vy,-850);fallSlide=true;shortJump=false;}else if(slide<=0){slide=.34;beep(260);}}}
function handleKey(event,down=true){
 if(hostPaused||disposed)return false;const k=event.key.toLowerCase();
 const relevant=[' ','arrowup','arrowdown','arrowleft','arrowright','w','s','a','d','e','r','q','p','escape'].includes(k);if(!relevant)return false;
 if(!down){if([' ','arrowup','w'].includes(k))releaseJump();if(['arrowdown','s'].includes(k))slideHeld=false;return true;}
 if(['arrowdown','s'].includes(k))slideHeld=true;
 if(event.repeat)return true;
 if(k===' '&&['ready','paused','ended','menu','story'].includes(mode)){overlay.querySelector('[data-i="0"]')?.click();return true;}
 if(['p','escape'].includes(k)){pause();return true;}
 if([' ','arrowup','w'].includes(k))control('jump');if(['arrowdown','s'].includes(k))control('slide');if(['a','arrowleft'].includes(k))control('upper');if(['d','arrowright'].includes(k))control('lower');if(k==='e')control('item');if(k==='r')control('heal');if(k==='q')control('time');report();return true;
}
window.addEventListener('keydown',event=>{if(handleKey(event))event.preventDefault();});
function releaseJump(){if(mode==='playing')shortJump=true;}
window.addEventListener('keyup',event=>{if(handleKey(event,false))event.preventDefault();});
document.querySelectorAll('.ctl').forEach(button=>{
 button.onpointerdown=event=>{event.preventDefault();button.setPointerCapture?.(event.pointerId);if(button.dataset.action==='slide')slideHeld=true;control(button.dataset.action);report();};
 button.onpointerup=button.onpointercancel=button.onlostpointercapture=()=>{if(button.dataset.action==='jump')releaseJump();if(button.dataset.action==='slide')slideHeld=false;};
});
// Tap the playfield for a short jump, hold the jump button for a longer jump; swipe to duck or change lanes.
let gesture=null;
cv.addEventListener('pointerdown',event=>{if(!coarse||hostPaused||mode!=='playing')return;event.preventDefault();cv.setPointerCapture?.(event.pointerId);gesture={x:event.clientX,y:event.clientY,moved:false};});
cv.addEventListener('pointermove',event=>{if(!gesture||gesture.moved)return;const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;gesture.moved=true;control(Math.abs(dx)>Math.abs(dy)?(dx<0?'upper':'lower'):(dy>0?'slide':'jump'));report();});
cv.addEventListener('pointerup',()=>{if(gesture&&!gesture.moved){control('jump');shortJump=true;report();}else releaseJump();gesture=null;});
cv.addEventListener('pointercancel',()=>{gesture=null;releaseJump();});
document.getElementById('pauseBtn').onclick=()=>{feedback();pause();};document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').textContent='声音：'+(sound?'开':'关');};
document.addEventListener('visibilitychange',()=>{if(document.hidden){shortJump=true;report();}if(!host)hostPaused=document.hidden;});window.addEventListener('blur',()=>{slideHeld=false;releaseJump();report();});
function activeLane(){return switchTime>.15?fromLane:lane;}
function update(dt){toastTime-=dt;if(toastTime<=0)toast.style.opacity=0;if(mode==='cinematic'){ending+=dt;if(journey===1||timedOut)trainX=Math.max(0,ending-1)*240;if(ending>4)finish(journey===2&&!timedOut);return;}if(mode!=='playing')return;
switchCooldown=Math.max(0,switchCooldown-dt);switchTime=Math.max(0,switchTime-dt);laneBlend=switchTime>0?fromLane+(lane-fromLane)*(1-switchTime/.3):lane;elapsed+=dt;if(elapsed>=timeLimit){elapsed=timeLimit;arrive(true);return;}speed=(220+240*Math.min(1,elapsed/50));world+=speed*dt;route=Math.min(DISTANCE,route+speed*dt);progress=route/DISTANCE*100;cleanTime+=dt;penaltyFlash=Math.max(0,penaltyFlash-dt);if(cleanTime>5)stamina=Math.min(100,stamina+3*dt);health=Math.ceil(stamina/34);clock=1170-(timeLimit-elapsed)/60;inv=Math.max(0,inv-dt);const motionDt=dt;if(slideHeld&&y===0)slide=Math.max(slide,.04);slide=Math.max(0,slide-motionDt);const slideTarget=slide>0&&y===0?1:0;slidePose+=(slideTarget-slidePose)*Math.min(1,motionDt*(slideTarget?22:14));if(Math.abs(slidePose-slideTarget)<.002)slidePose=slideTarget;if(y>0||vy>0){jumpAge+=motionDt;if(shortJump&&jumpAge>=.13){if(vy>400)vy=400;shortJump=false;}vy-=1800*motionDt;y=Math.max(0,y+vy*motionDt);if(y===0){vy=0;if(fallSlide){slide=.45;fallSlide=false;}}}
spawn-=speed*dt;if(spawn<=0&&route<DISTANCE-1350){buildSection(section++);spawn=1850;}
for(const o of obs){o.x-=speed*dt;if(o.hit)continue;if(o.type==='detour'){if(o.x<PX&&!o.resolved){o.resolved=true;if(activeLane()===o.lane){route=Math.max(0,route-320);progress=route/DISTANCE*100;detours++;say('绕行通道 · 多走一段路');}}continue;}if(o.lane!==undefined&&o.lane!==activeLane())continue;if(o.collided)continue;const box=obstacleBox(o),player=playerBox();if(!overlap(player,box))continue;
if(isItem(o.type)){if(journey===2){o.hit=true;if(o.type==='item')items=Math.min(3,items+1);if(o.type==='heal')meds=Math.min(3,meds+1);if(o.type==='time')clocks=Math.min(3,clocks+1);beep(900);say({item:'护盾已收好 · E 使用',heal:'体力已收好 · R 使用',time:'延时已收好 · Q 使用（+5 秒）'}[o.type]);}continue;}
